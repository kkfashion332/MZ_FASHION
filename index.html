<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MZ Fashion - Premium Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;600&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
<!-- CSS Link -->
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- INTRO ANIMATION SCREEN -->
<div id="intro-container">
  <div class="bg-radial"></div>
  <div class="vignette"></div>
  <div class="particles" id="particles"></div>

  <section class="hero">
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="brush"></div>
      <div class="logo-inner">
        <div class="tiles" id="tiles"></div>
        <div class="shine-wrap"><div class="shine"></div></div>
      </div>
    </div>
    <div class="tag">Welcome to your trusted shop</div>
    <h1>
      <span class="w w1">Your</span>
      <span class="w w2 gold">Style,</span>
      <span class="w w3">My</span>
      <span class="w w4 gold">Shop.</span>
    </h1>
  </section>
</div>

<!-- MAIN WEBSITE CONTENT -->
<div id="main-website">
  <header>
    <!-- Upper Left Sphere Logo (7 Taps for Admin) -->
    <div class="logo-sphere" onclick="window.handleLogoTap()"></div>
    <div class="brand-title">MZ FASHION</div>
  </header>

  <main>
    <!-- Banners Section (Realtime Data + Auto Swipe) -->
    <div class="banners-container" id="banner-container">
      <div class="no-data">Loading Banners...</div>
    </div>

    <!-- Products Section (Realtime Data) -->
    <h2 class="section-title">All products available</h2>
    <div class="products-grid" id="product-grid">
      <div class="no-data" style="grid-column: span 2;">Loading Products...</div>
    </div>
  </main>
</div>

<!-- ADVANCED ADMIN PLANNER MODAL -->
<div id="admin-modal">
  <div class="admin-panel">
    <h2>Admin Planner</h2>
    
    <!-- Manage Banners Section -->
    <div class="admin-section">
      <h3>Manage Banners</h3>
      <button class="admin-btn full-width" onclick="window.addBanner()">+ Add New Banner (with Link)</button>
      <div class="admin-list" id="admin-banner-list">
        <!-- Banners will be listed here -->
      </div>
    </div>

    <!-- Manage Products Section -->
    <div class="admin-section" style="margin-top: 20px;">
      <h3>Manage Products</h3>
      <button class="admin-btn full-width" onclick="window.addProduct()">+ Add New Product</button>
      <div class="admin-list" id="admin-product-list">
        <!-- Products will be listed here -->
      </div>
    </div>

    <button class="admin-btn close-admin full-width" onclick="window.closeAdmin()">Close Admin Planner</button>
  </div>
</div>

<!-- JS Link (Type module is necessary for Firebase) -->
<script type="module" src="app.js"></script>
</body>
</html>
