<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MZ Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .content-padding { padding-bottom: 90px; }
        .size-radio:checked + label {
            background-color: #eab308;
            color: #fff;
            border-color: #eab308;
        }
        /* Make inputs autofill look clean in light theme */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Top Navbar (Curved Design Matching Reference) -->
    <nav id="topNav" class="hidden bg-[#0a0a0a] pt-4 pb-6 px-4 flex justify-between items-center sticky top-0 z-[100] shadow-[0_8px_20px_rgba(0,0,0,0.25)] border-b-[2.5px] border-yellow-500 rounded-b-[2.5rem]">
        <div class="flex items-center w-full justify-between relative px-2">
            <!-- Left: Logo -->
            <div class="flex-shrink-0">
                <img id="secretLogo" src="logo.png" onerror="this.src='https://ui-avatars.com/api/?name=MZ&background=000&color=D4AF37'" alt="MZ Fashion" class="w-12 h-12 rounded-full cursor-pointer border-2 border-yellow-500 object-cover shadow-[0_0_10px_rgba(212,175,55,0.5)]">
            </div>
            
            <!-- Center: Title & Subtitle -->
            <div class="flex flex-col items-center justify-center cursor-pointer absolute left-1/2 transform -translate-x-1/2 mt-1" onclick="goHome()">
                <span class="font-black text-[24px] tracking-[0.1em] text-white leading-none">MZ FASHION</span>
                <div class="flex items-center gap-2 mt-1 w-full justify-center opacity-90">
                    <div class="w-6 h-[1px] bg-yellow-500"></div>
                    <span class="text-[7px] tracking-[0.25em] text-yellow-500 uppercase whitespace-nowrap font-bold">Style Your Story</span>
                    <div class="w-6 h-[1px] bg-yellow-500"></div>
                </div>
            </div>

            <!-- Right: Search & Cart Icons -->
            <div class="flex items-center gap-5 text-white text-[20px] flex-shrink-0 mt-1">
                <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-yellow-500 transition drop-shadow-md"></i>
                <div class="relative cursor-pointer hover:text-yellow-500 transition drop-shadow-md" onclick="showCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="topCartBadge" class="absolute -top-2 -right-2.5 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden border border-black shadow-sm">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main App Container -->
    <div id="app" class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl content-padding relative">
        <div class="min-h-screen flex flex-col items-center justify-center text-yellow-500">
            <i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i>
            <p class="font-bold tracking-widest text-gray-800">LOADING STORE...</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div id="bottomNav" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-2 max-w-md mx-auto z-[60] flex justify-around items-center h-16 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
        <div onclick="requireAuth(() => showLikes())" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-heart text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Likes</span></div>
        <div onclick="requireAuth(() => showMyOrders())" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-box text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Orders</span></div>
        <div class="w-1/5 flex justify-center relative">
            <div onclick="goHome()" class="absolute -top-10 w-14 h-14 bg-gradient-to-r from-yellow-500 to-yellow-400 rounded-full flex items-center justify-center text-white text-2xl shadow-[0_0_15px_rgba(212,175,55,0.4)] border-[3px] border-white cursor-pointer z-50 transition-transform active:scale-95"><i class="fa-solid fa-house drop-shadow-md"></i></div>
        </div>
        <div onclick="showCart()" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer relative transition-colors"><i class="fa-solid fa-cart-shopping text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Cart</span><span id="bottomCartCount" class="absolute -top-1 right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden border border-white">0</span></div>
        <div onclick="requireAuth(() => showProfile())" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-user text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Profile</span></div>
    </div>

    <div id="imageModalContainer"></div>

    <script>
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDYbppZ6nR4qs9tTZswSnVwurPI-Z5EqJ8",
            authDomain: "mzfashion.firebaseapp.com",
            databaseURL: "https://mzfashion-default-rtdb.firebaseio.com",
            projectId: "mzfashion",
            storageBucket: "mzfashion.firebasestorage.app",
            messagingSenderId: "355960541786",
            appId: "1:355960541786:web:df4b50d44291d0dd0c3e63"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- DYNAMIC DATA STATE ---
        let categories = []; 
        let products = [];
        let banners = [];
        let paymentSettings = { qr_url: "", upi_id: "", whatsapp: "919982437489" };
        
        let currentUser = JSON.parse(localStorage.getItem('mz_currentUser')) || null;
        let cart = JSON.parse(localStorage.getItem('mz_cart')) || [];
        let likedItems = JSON.parse(localStorage.getItem('mz_likes')) || [];
        let activeCategory = ""; 
        let tempCheckoutData = null; 
        
        let currentSelectedSize = null; 
        let currentComboSize1 = null; 
        let currentComboSize2 = null; 
        
        const appDiv = document.getElementById('app');
        const topNav = document.getElementById('topNav');
        const bottomNav = document.getElementById('bottomNav');

        // --- AUTH & LOGIN SMART FLOW ---
        let pendingCallback = null;

        function requireAuth(callback) {
            if (currentUser) {
                if (callback) callback();
            } else {
                pendingCallback = callback;
                showLogin();
            }
        }

        function showNavs() {
            topNav.classList.remove('hidden');
            bottomNav.classList.remove('hidden');
        }

        function hideNavs() {
            topNav.classList.add('hidden');
            bottomNav.classList.add('hidden');
        }

        // --- REALTIME DATABASE SYNC ---
        async function initApp() {
            try {
                const prodSnapCheck = await db.ref('products').once('value');
                if (!prodSnapCheck.exists()) {
                    await seedInitialData();
                }

                const catSnap = await db.ref('categories').once('value');
                if(catSnap.exists()) {
                    categories = []; 
                    catSnap.forEach(child => {
                        if(child.val() && typeof child.val() === 'object') {
                            categories.push(child.val());
                        }
                    });
                }

                const pSnap = await db.ref('products').once('value');
                if(pSnap.exists()) {
                    products = [];
                    pSnap.forEach(child => {
                        if(child.val() && typeof child.val() === 'object') {
                            products.push(child.val());
                        }
                    });
                }

                const bSnap = await db.ref('banners').once('value');
                if(bSnap.exists()) {
                    banners = [];
                    bSnap.forEach(child => {
                        if(child.val() && typeof child.val() === 'object') {
                            banners.push(child.val());
                        }
                    });
                }

                const paySnap = await db.ref('settings/payment').once('value');
                if(paySnap.exists()) paymentSettings = paySnap.val();

                // Load Home freely without forcing login
                goHome();
                updateCartBadge();
            } catch (error) {
                console.error("Database connection error: ", error);
                appDiv.innerHTML = `<div class="text-center mt-20 text-red-500 font-bold">Network Error. Please refresh.</div>`;
            }
        }

        async function seedInitialData() {
            await db.ref('settings/payment').set({
                qr_url: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=dummy@upi&pn=MZFASHION",
                upi_id: "dummy@upi",
                whatsapp: "919982437489"
            });
            await db.ref('banners').set({
                b1: { id: "b1", img: "256328.jpg", target_link: "#" },
                b2: { id: "b2", img: "https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=800&q=80", target_link: "#" }
            });
            await db.ref('categories').set({
                c1: { id: "c1", name: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=150&q=80" },
                c2: { id: "c2", name: "Jeans", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=150&q=80" },
                c3: { id: "c3", name: "Combos", img: "https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=150&q=80" }
            });
            await db.ref('products').set({
                p1: { id: "p1", name: "Premium Black T-Shirt", price: 499, mrp: 999, discount: "50% OFF", category: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80", shirtSizes: "S, M, L, XL, XXL", jeansSizes: "" },
                p2: { id: "p2", name: "Ripped Blue Jeans", price: 1099, mrp: 1999, discount: "45% OFF", category: "Jeans", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400&q=80", shirtSizes: "", jeansSizes: "28, 30, 32, 34, 36" },
                p3: { id: "p3", name: "Combo (Shirt + Jeans)", price: 1499, mrp: 3198, discount: "53% OFF", category: "Combos", img: "https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=400&q=80", shirtSizes: "S, M, L, XL, XXL", jeansSizes: "28, 30, 32, 34, 36" }
            });
        }

        // --- AUTHENTICATION VIEWS ---
        function showLogin() {
            hideNavs();
            appDiv.innerHTML = `
                <div class="fade-in p-6 flex flex-col justify-center min-h-screen bg-white">
                    <div class="text-center mb-10">
                        <div class="w-24 h-24 mx-auto border-[3px] border-yellow-500 rounded-full overflow-hidden mb-4 shadow-[0_0_20px_rgba(212,175,55,0.4)]">
                            <img src="logo.png" onerror="this.src='https://ui-avatars.com/api/?name=MZ&background=000&color=D4AF37'" class="w-full h-full object-cover">
                        </div>
                        <h1 class="text-3xl font-black text-gray-900 tracking-widest uppercase">Welcome Back</h1>
                        <p class="text-gray-500 mt-2 text-sm font-bold">Login to continue your checkout.</p>
                    </div>
                    
                    <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                        <div class="relative"><i class="fa-solid fa-phone absolute left-4 top-4 text-gray-400"></i><input type="tel" id="loginPhone" placeholder="Phone Number" required class="bg-gray-50 border border-gray-300 focus:border-yellow-500 focus:bg-white outline-none text-gray-900 p-3.5 pl-12 rounded-xl w-full font-semibold transition-colors shadow-sm"></div>
                        <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-4 text-gray-400"></i><input type="password" id="loginPassword" placeholder="Password" required class="bg-gray-50 border border-gray-300 focus:border-yellow-500 focus:bg-white outline-none text-gray-900 p-3.5 pl-12 rounded-xl w-full font-semibold transition-colors shadow-sm"></div>
                        <p id="loginError" class="text-red-500 text-xs text-center hidden font-bold">Invalid phone or password.</p>
                        <button type="submit" id="loginBtn" class="mt-4 bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-black py-4 rounded-xl shadow-md w-full tracking-wide transition transform active:scale-95 text-lg">LOGIN SECURELY</button>
                    </form>
                    
                    <p class="text-center text-gray-500 mt-6 text-sm font-bold">Don't have an account? <span onclick="showRegister()" class="text-yellow-600 font-black cursor-pointer hover:underline">Register Now</span></p>
                    
                    <div class="mt-8 text-center border-t border-gray-100 pt-6">
                        <button onclick="goHome()" class="text-gray-400 hover:text-gray-800 font-extrabold text-sm transition flex items-center justify-center gap-2 w-full"><i class="fa-solid fa-arrow-left"></i> Skip & Back to Store</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function showRegister() {
            hideNavs();
            appDiv.innerHTML = `
                <div class="fade-in p-6 flex flex-col justify-center min-h-screen bg-white">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-black text-gray-900 tracking-widest uppercase">CREATE ACCOUNT</h1>
                        <p class="text-gray-500 mt-2 text-sm font-bold">Register to start shopping.</p>
                    </div>
                    
                    <form onsubmit="handleRegister(event)" class="flex flex-col gap-4">
                        <div class="relative"><i class="fa-solid fa-user absolute left-4 top-4 text-gray-400"></i><input type="text" id="regName" placeholder="Full Name" required class="bg-gray-50 border border-gray-300 focus:border-yellow-500 focus:bg-white outline-none text-gray-900 p-3.5 pl-12 rounded-xl w-full font-semibold transition-colors shadow-sm"></div>
                        <div class="relative"><i class="fa-solid fa-phone absolute left-4 top-4 text-gray-400"></i><input type="tel" id="regPhone" placeholder="Phone Number" required class="bg-gray-50 border border-gray-300 focus:border-yellow-500 focus:bg-white outline-none text-gray-900 p-3.5 pl-12 rounded-xl w-full font-semibold transition-colors shadow-sm"></div>
                        <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-4 text-gray-400"></i><input type="password" id="regPassword" placeholder="Password" required class="bg-gray-50 border border-gray-300 focus:border-yellow-500 focus:bg-white outline-none text-gray-900 p-3.5 pl-12 rounded-xl w-full font-semibold transition-colors shadow-sm"></div>
                        <p id="regError" class="text-red-500 text-xs text-center hidden font-bold">Phone number already registered.</p>
                        <button type="submit" id="regBtn" class="mt-4 bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-black py-4 rounded-xl shadow-md w-full tracking-wide transition transform active:scale-95 text-lg">CREATE ACCOUNT</button>
                    </form>
                    
                    <p class="text-center text-gray-500 mt-6 text-sm font-bold">Already have an account? <span onclick="showLogin()" class="text-yellow-600 font-black cursor-pointer hover:underline">Login Here</span></p>

                    <div class="mt-8 text-center border-t border-gray-100 pt-6">
                        <button onclick="goHome()" class="text-gray-400 hover:text-gray-800 font-extrabold text-sm transition flex items-center justify-center gap-2 w-full"><i class="fa-solid fa-arrow-left"></i> Skip & Back to Store</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> LOGGING IN...`;

            try {
                const snapshot = await db.ref('users/' + phone).once('value');
                if (snapshot.exists() && snapshot.val().password === pass) {
                    currentUser = snapshot.val();
                    localStorage.setItem('mz_currentUser', JSON.stringify(currentUser));
                    updateCartBadge();
                    
                    // Route user back to checkout if they came from there
                    if(pendingCallback) {
                        const cb = pendingCallback;
                        pendingCallback = null;
                        showNavs();
                        cb();
                    } else {
                        goHome();
                    }
                } else {
                    document.getElementById('loginError').classList.remove('hidden');
                    btn.innerHTML = "LOGIN SECURELY";
                }
            } catch (error) {
                alert("Database Error!");
                btn.innerHTML = "LOGIN SECURELY";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const pass = document.getElementById('regPassword').value;
            const btn = document.getElementById('regBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> CREATING ACCOUNT...`;
            
            try {
                const snapshot = await db.ref('users/' + phone).once('value');
                if (snapshot.exists()) {
                    document.getElementById('regError').classList.remove('hidden');
                    btn.innerHTML = "CREATE ACCOUNT";
                    return;
                }
                const newUser = { name, phone, password: pass, linkedEmail: "mzfashion@gmail.com" };
                await db.ref('users/' + phone).set(newUser);
                currentUser = newUser;
                localStorage.setItem('mz_currentUser', JSON.stringify(newUser));
                
                // Route user back to checkout if they came from there
                if(pendingCallback) {
                    const cb = pendingCallback;
                    pendingCallback = null;
                    showNavs();
                    cb();
                } else {
                    goHome();
                }
            } catch (error) {
                alert("Database Error!");
                btn.innerHTML = "CREATE ACCOUNT";
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('mz_currentUser');
            goHome(); // Refresh back to open store
        }

        function handleLikeClick(btn, id) {
            requireAuth(() => toggleLike(btn, id));
        }

        // --- VIEWS ---

        // 1. HOME PAGE
        function goHome() {
            showNavs();
            pendingCallback = null; // Clear pending intent
            
            let displayProducts = products;
            if(activeCategory !== "") {
                displayProducts = products.filter(p => p.category === activeCategory);
            }

            let catHTML = categories.map(cat => `
                <div onclick="filterCategory('${cat.name}')" class="flex flex-col items-center gap-1.5 cursor-pointer w-full">
                    <div class="w-14 h-14 rounded-full overflow-hidden border-[2.5px] ${activeCategory === cat.name ? 'border-yellow-500 shadow-md scale-105' : 'border-gray-200'} transition-all mx-auto flex-shrink-0 bg-white">
                        <img src="${cat.img}" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[9px] md:text-[10px] ${activeCategory === cat.name ? 'text-yellow-600 font-extrabold' : 'text-gray-600 font-bold'} text-center w-full uppercase break-words line-clamp-2 leading-tight">${cat.name}</span>
                </div>
            `).join('');
            
            // --- SINGLE COLUMN PRODUCT CARDS (LARGE DISPLAY) ---
            let prodHTML = displayProducts.map(item => {
                const isLiked = likedItems.includes(item.id);
                return `
                <div class="bg-white border border-gray-200 rounded-[20px] shadow-[0_6px_20px_rgba(0,0,0,0.06)] relative flex flex-col justify-between overflow-hidden group">
                    <button onclick="event.stopPropagation(); handleLikeClick(this, '${item.id}')" class="absolute top-4 right-4 ${isLiked ? 'text-red-500' : 'text-gray-300'} z-10 text-2xl bg-white/90 rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-sm shadow-md transition-colors hover:scale-110">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <div onclick="viewProduct('${item.id}')" class="cursor-pointer relative overflow-hidden">
                        <img src="${item.img}" class="w-full h-[400px] object-cover transform group-hover:scale-105 transition duration-500">
                    </div>
                    <div class="p-5 flex flex-col flex-grow border-t border-gray-100">
                        <h3 onclick="viewProduct('${item.id}')" class="text-xl font-extrabold truncate text-gray-900 cursor-pointer hover:text-yellow-600 transition tracking-tight">${item.name}</h3>
                        <div class="mt-2 flex items-center gap-3">
                            <span class="font-black text-gray-900 text-2xl">₹${item.price}</span>
                            <span class="text-sm line-through text-gray-400 font-bold mt-1">₹${item.mrp}</span>
                        </div>
                        
                        <!-- GREEN DISCOUNT BADGE -->
                        <span class="text-[11px] text-white font-extrabold mt-3 bg-green-600 px-3 py-1 w-max rounded-md shadow-sm uppercase tracking-wider">${item.discount}</span>
                        
                        <div class="flex justify-between gap-3 mt-5">
                            <button onclick="event.stopPropagation(); viewProduct('${item.id}')" class="flex-1 bg-white border-2 border-yellow-500 text-yellow-600 font-extrabold py-3.5 rounded-xl text-xs shadow-sm hover:bg-yellow-50 hover:shadow transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cart-plus text-base"></i> ADD TO CART
                            </button>
                            <button onclick="event.stopPropagation(); viewProduct('${item.id}')" class="flex-1 bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-extrabold py-3.5 rounded-xl shadow-md hover:shadow-lg transition text-xs flex items-center justify-center gap-2">
                                BUY NOW <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');

            if(displayProducts.length === 0) {
                prodHTML = `<div class="text-center text-gray-500 py-10 font-semibold w-full">No products found.</div>`;
            }

            let bannerHTML = banners.map(b => `
                <a href="${b.target_link || '#'}" class="min-w-full flex-shrink-0 snap-center relative h-60 block">
                    <img src="${b.img}" class="w-full h-full object-cover">
                </a>
            `).join('');

            appDiv.innerHTML = `
                <div id="homeView" class="fade-in bg-gray-50 min-h-screen pb-6">
                    <!-- Banner Slider -->
                    <div id="bannerSlider" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar relative shadow-sm" style="scroll-behavior: smooth;">
                        ${bannerHTML}
                    </div>

                    <!-- Categories 5 Column Grid -->
                    <div class="grid grid-cols-5 gap-y-4 gap-x-2 py-5 px-3 bg-white border-b border-gray-200 justify-items-center items-start shadow-sm mb-2 rounded-b-2xl">
                        ${catHTML}
                    </div>
                    
                    <div class="p-4 bg-gray-50 rounded-t-2xl">
                        <div class="flex items-center gap-3 mb-6 mt-2 ml-1">
                            <div class="w-1.5 h-6 bg-yellow-500 rounded"></div>
                            <h2 class="font-extrabold text-lg text-gray-900 tracking-wider uppercase">${activeCategory !== "" ? activeCategory : "LATEST COLLECTION"}</h2>
                        </div>
                        
                        <!-- SINGLE COLUMN GRID HERE -->
                        <div class="grid grid-cols-1 gap-8">
                            ${prodHTML}
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);

            if(window.bannerScrollInterval) clearInterval(window.bannerScrollInterval);
            if(banners.length > 1) {
                setTimeout(() => {
                    window.bannerScrollInterval = setInterval(() => {
                        const slider = document.getElementById('bannerSlider');
                        if(!slider) {
                            clearInterval(window.bannerScrollInterval);
                            return;
                        }
                        const maxScrollLeft = slider.scrollWidth - slider.clientWidth;
                        if(slider.scrollLeft >= maxScrollLeft - 5) {
                            slider.scrollTo({ left: 0, behavior: 'smooth' });
                        } else {
                            slider.scrollBy({ left: slider.clientWidth, behavior: 'smooth' });
                        }
                    }, 3000); 
                }, 500);
            }

        function getValidatedSize(product) {
            let hasShirt = !!product.shirtSizes && product.shirtSizes.trim() !== "";
            let hasJeans = !!product.jeansSizes && product.jeansSizes.trim() !== "";
            
            if (hasShirt && hasJeans) {
                if(!currentComboSize1 || !currentComboSize2) return null;
                return `Top: ${currentComboSize1}, Bottom: ${currentComboSize2}`;
            } else if (hasShirt) {
                if(!currentComboSize1) return null;
                return currentComboSize1;
            } else if (hasJeans) {
                if(!currentComboSize2) return null;
                return currentComboSize2;
            } else {
                if(!currentSelectedSize) return null;
                return currentSelectedSize;
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const finalSize = getValidatedSize(product);
            
            if(!finalSize) {
                alert("Please select required sizes first!");
                return;
            }

            cart.push({ ...product, size: finalSize, cartId: Date.now() });
            localStorage.setItem('mz_cart', JSON.stringify(cart));
            updateCartBadge();
            
            const btn = document.getElementById(`addBtn-${id}`);
            if(btn) {
                const originalText = btn.innerHTML;

        // --- AUTOMATIC PINCODE FETCHING LOGIC ---
        async function fetchPinCodeDetails(pincode) {
            const statusEl = document.getElementById('pinStatus');
            const districtEl = document.getElementById('custDistrict');
            const stateEl = document.getElementById('custState');
            const villageEl = document.getElementById('custVillage');
            
            if (pincode.length === 6) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
                try {
                    let response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    let data = await response.json();
                    
                    if (data[0].Status === "Success") {
                        let postOffices = data[0].PostOffice;
                        districtEl.value = postOffices[0].District;
                        stateEl.value = postOffices[0].State;
                        
                        villageEl.innerHTML = '<option value="" disabled selected>Select Village / Area</option>';
                        postOffices.forEach(po => {
                            villageEl.innerHTML += `<option value="${po.Name}">${po.Name}</option>`;
                        });
                        villageEl.classList.remove('bg-gray-100', 'text-gray-500');
                        villageEl.classList.add('bg-white', 'text-gray-900', 'border-yellow-500');
                        statusEl.innerHTML = '<i class="fa-solid fa-check text-green-600"></i> Found';
                    } else {
                        statusEl.innerHTML = '<span class="text-red-500">Invalid PIN</span>';
                        districtEl.value = ""; stateEl.value = "";
                        villageEl.innerHTML = '<option value="" disabled selected>Enter valid PIN first</option>';
                        villageEl.classList.add('bg-gray-100', 'text-gray-500'); villageEl.classList.remove('bg-white', 'text-gray-900', 'border-yellow-500');
                    }
                } catch (e) {
                    statusEl.innerHTML = '<span class="text-red-500">Error</span>';
                }
            } else {
                statusEl.innerHTML = ''; districtEl.value = ""; stateEl.value = "";
                villageEl.innerHTML = '<option value="" disabled selected>Enter PIN to select Village</option>';
                villageEl.classList.add('bg-gray-100', 'text-gray-500'); villageEl.classList.remove('bg-white', 'text-gray-900', 'border-yellow-500');
            }
        }

                            </div>
                            
                            <div class="flex gap-3">
                                <input type="text" id="custDistrict" placeholder="District" required readonly class="bg-gray-100 border border-gray-200 text-gray-500 p-3.5 rounded-lg w-1/2 text-sm font-medium focus:outline-none">
                                <input type="text" id="custState" placeholder="State" required readonly class="bg-gray-100 border border-gray-200 text-gray-500 p-3.5 rounded-lg w-1/2 text-sm font-medium focus:outline-none">
                            </div>
                            
                            <select id="custVillage" required class="bg-gray-100 border border-gray-200 text-gray-500 p-3.5 rounded-lg w-full text-sm font-medium focus:outline-none focus:border-yellow-500 transition cursor-pointer">
                                <option value="" disabled selected>Enter PIN to select Village / Area</option>
                            </select>
                            
                            <textarea id="custAddress" placeholder="Complete Address (House No, Street Area)" required class="bg-white border border-gray-300 focus:border-yellow-500 outline-none text-gray-900 p-3.5 rounded-lg w-full text-sm font-medium transition mt-2" rows="3"></textarea>
                        </div>
                        
                        <div class="fixed bottom-[64px] left-0 w-full bg-white border-t border-gray-200 p-3 max-w-md mx-auto z-40 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
                            <button type="submit" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-extrabold py-3.5 rounded-xl shadow-md tracking-wide hover:shadow-lg transition transform active:scale-95 text-sm">NEXT: PAYMENT <i class="fa-solid fa-arrow-right ml-1"></i></button>
                        </div>
                    </form>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function goToPayment(event) {
            event.preventDefault();
            
            tempCheckoutData.name = document.getElementById('custName').value;
            tempCheckoutData.phone = document.getElementById('custPhone').value;
            const district = document.getElementById('custDistrict').value;
            const state = document.getElementById('custState').value;
            const village = document.getElementById('custVillage').value;
            const pincode = document.getElementById('custPincode').value;
            const baseAddress = document.getElementById('custAddress').value;
            
            if(!district || !state || !village) {
                alert("Please enter a valid PIN Code and select your Village/Area!");
                return;
            }
            tempCheckoutData.address = `${baseAddress}, ${village}, ${district}, ${state} (PIN: ${pincode})`;
            
            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-24 bg-gray-50 min-h-screen">
                    <div class="flex items-center gap-2 mb-6 border-b border-gray-200 pb-3">
                        <div class="w-1.5 h-6 bg-yellow-500 rounded"></div>
                        <h1 class="text-xl font-extrabold text-gray-800 uppercase tracking-wide">Select Payment</h1>
                    </div>
                    
                    <div class="bg-white p-5 rounded-xl border border-gray-200 mb-6 flex justify-between items-center shadow-sm">
                        <span class="text-gray-500 font-bold text-sm uppercase">Total to Pay</span>
                        <span class="font-black text-2xl text-gray-900">₹${tempCheckoutData.price}</span>
                    </div>
                    
                    <form onsubmit="confirmOrder(event)">
                        <div class="mb-6">
                            <label class="flex items-center gap-3 bg-white p-4 rounded-xl border border-gray-200 mb-3 cursor-pointer shadow-sm hover:border-yellow-500 transition">
                                <input type="radio" id="prepaid" name="payment" value="Prepaid" onchange="renderPaymentUI()" class="accent-yellow-500 w-5 h-5 cursor-pointer">
                                <span class="text-gray-800 font-bold text-sm w-full">Prepaid (Full Payment)</span>
                            </label>
                            
                            <label class="flex items-center gap-3 bg-white p-4 rounded-xl border border-gray-200 mb-3 cursor-pointer shadow-sm hover:border-yellow-500 transition">
                                <input type="radio" id="cod" name="payment" value="COD" onchange="renderPaymentUI()" class="accent-yellow-500 w-5 h-5 cursor-pointer" checked>
                                <span class="text-gray-800 font-bold text-sm w-full">Cash on Delivery (C.O.D)</span>
                            </label>
                            
                            <div id="paymentUI" class="mt-5 p-5 bg-white border border-yellow-300 rounded-xl shadow-md hidden"></div>
                        </div>
                        
                        <div class="fixed bottom-[64px] left-0 w-full bg-white border-t border-gray-200 p-3 max-w-md mx-auto z-40 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
                            <button type="submit" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-extrabold py-3.5 rounded-xl shadow-md tracking-wide hover:shadow-lg transition transform active:scale-95 text-sm">PLACE ORDER <i class="fa-solid fa-check ml-1"></i></button>
                        </div>
                    </form>
                </div>
            `;
            window.scrollTo(0,0);
            renderPaymentUI();
        }

        function renderPaymentUI() {
            const isCOD = document.getElementById('cod').checked;
            const uiDiv = document.getElementById('paymentUI');
            uiDiv.classList.remove('hidden');
            const totalAmount = tempCheckoutData.price;
            const qrUrl = paymentSettings.qr_url;

            if (!isCOD) {
                uiDiv.innerHTML = `
                    <p class="text-center text-sm text-gray-500 font-bold mb-2">Scan QR to pay Full Amount</p>
                    <p class="text-center font-black text-2xl text-gray-900 mb-5">₹${totalAmount}</p>
                    <div class="flex justify-center mb-5"><img src="${qrUrl}" class="w-36 h-36 border-4 border-gray-100 rounded-xl p-1 bg-white shadow-sm"></div>
                    <div class="bg-red-50 border border-red-200 p-3 rounded-lg mb-3">
                        <p class="text-[11px] text-center text-red-600 font-bold">⚠️ Please complete the payment now.</p>
                        <p class="text-[10px] text-center text-gray-600 mt-1 font-medium">You will need to send the screenshot on the next screen to confirm your order.</p>
                    </div>
                `;
            } else {
                const tokenAmount = Math.round(totalAmount * 0.30);
                uiDiv.innerHTML = `
                    <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg mb-4 text-center shadow-sm">
                        <p class="text-[11px] text-yellow-700 font-bold">For C.O.D, 30% advance token is required.</p>
                        <p class="font-black text-xl text-gray-900 mt-1">Token: ₹${tokenAmount}</p>
                    </div>
                    <div class="flex justify-center mb-5"><img src="${qrUrl}" class="w-36 h-36 border-4 border-gray-100 rounded-xl p-1 bg-white shadow-sm"></div>
                    <div class="bg-red-50 border border-red-200 p-3 rounded-lg mb-2">
                        <p class="text-[11px] text-center text-red-600 font-bold">⚠️ Please complete the token payment now.</p>
                        <p class="text-[10px] text-center text-gray-600 mt-1 font-medium">You will need to send the screenshot on the next screen to confirm your order.</p>
                    </div>
                `;
            }
        }

        async function confirmOrder(event) {
            event.preventDefault();
            const paymentType = document.getElementById('cod').checked ? "COD" : "Prepaid";
            const newOrder = {
                id: Date.now().toString(), date: new Date().toLocaleString(),
                name: tempCheckoutData.name, phone: tempCheckoutData.phone,
                address: tempCheckoutData.address, payment: paymentType,
                product_name: tempCheckoutData.names, price: tempCheckoutData.price,
                img: tempCheckoutData.img, 
                items: tempCheckoutData.items, 
                status: "Pending Verification" 
            };
            appDiv.innerHTML = `<div class="min-h-[70vh] flex flex-col items-center justify-center text-yellow-500 bg-gray-50"><i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i><p class="font-bold tracking-widest text-gray-800">PLACING ORDER...</p></div>`;
            window.scrollTo(0,0);
            try {
                await db.ref('orders/' + newOrder.id).set(newOrder);
                cart = []; localStorage.setItem('mz_cart', JSON.stringify(cart)); updateCartBadge();
                
                const waNum = paymentSettings.whatsapp;
                const waText = encodeURIComponent(`Hello MZ Fashion, here is my payment screenshot for Order ID: ${newOrder.id}`);

                appDiv.innerHTML = `
                    <div class="fade-in flex flex-col items-center justify-center min-h-screen bg-gray-50 p-5 text-center pb-24">
                        <div class="w-20 h-20 bg-white border-[3px] border-yellow-500 text-yellow-500 rounded-full flex items-center justify-center text-4xl mb-5 shadow-lg"><i class="fa-solid fa-clock"></i></div>
                        <h1 class="text-2xl font-extrabold text-gray-900 uppercase">Verification Pending!</h1>
                        <p class="text-gray-500 mt-2 text-sm font-medium">Thank you, <span class="text-gray-800 font-bold">${tempCheckoutData.name}</span>.</p>
                        <p class="text-gray-500 mt-1 text-sm font-medium">Order ID: <b class="text-gray-900 text-xs">${newOrder.id}</b></p>
                        
                        <div class="bg-white border-2 border-red-100 p-5 rounded-xl mt-6 mb-6 w-full max-w-sm shadow-md">
                            <p class="text-sm text-red-500 font-extrabold mb-4 leading-snug">⚠️ Order will NOT be dispatched until payment screenshot is received.</p>
                            <a href="https://wa.me/${waNum}?text=${waText}" target="_blank" class="flex w-full items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md animate-pulse transition">
                                <i class="fa-brands fa-whatsapp text-2xl"></i> SEND SCREENSHOT NOW
                            </a>
                        </div>

                        <button onclick="requireAuth(() => showMyOrders())" class="mt-2 bg-gradient-to-r from-yellow-500 to-yellow-400 text-white px-8 py-3.5 rounded-xl font-extrabold shadow-md transition-all w-full max-w-xs uppercase text-sm">View My Orders</button>
                        <button onclick="goHome()" class="mt-4 bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 px-8 py-3.5 rounded-xl font-extrabold shadow-sm transition-all w-full max-w-xs uppercase text-sm">Continue Shopping</button>
                    </div>
                `;
            } catch (error) { alert("Database Error!"); goHome(); }
        }

        // --- MY ORDERS PAGE ---
        async function showMyOrders() {
            showNavs();
            appDiv.innerHTML = `<div class="min-h-[70vh] flex flex-col items-center justify-center text-yellow-500 bg-gray-50"><i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i><p class="font-bold tracking-widest text-gray-800">LOADING ORDERS...</p></div>`;
            window.scrollTo(0,0);
            try {
                const snapshot = await db.ref('orders').orderByChild('phone').equalTo(currentUser.phone).once('value');
                let userOrders = []; snapshot.forEach(child => { userOrders.push(child.val()); });
                userOrders.sort((a, b) => b.id - a.id);
                let myOrdersHTML = "";
                if (userOrders.length > 0) {
                    userOrders.forEach(order => {
                        let paymentStatus = ""; let tokenAmount = 0; let remainingAmount = 0;
                        if(order.payment === "COD") {
                            tokenAmount = Math.round(order.price * 0.30); remainingAmount = order.price - tokenAmount;
                            paymentStatus = `<p class="text-xs text-gray-500 mt-1 font-medium">Total: <span class="text-gray-800 font-bold">₹${order.price}</span></p><p class="text-xs text-green-600 font-bold mt-0.5">Paid Token: ₹${tokenAmount}</p><p class="text-xs text-red-500 font-bold mt-0.5">To Pay on Delivery: ₹${remainingAmount}</p>`;
                        } else {
                            paymentStatus = `<p class="text-xs text-gray-500 mt-1 font-medium">Total: <span class="text-gray-800 font-bold">₹${order.price}</span></p><p class="text-xs text-green-600 font-bold mt-0.5">Paid: ₹${order.price} (Full Payment)</p>`;
                        }
                        
                        let statusBadge = "";
                        let currentStatus = order.status || "Pending Verification";
                        if(currentStatus === "Confirmed") {
                            statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-1 bg-green-50 text-green-600 text-[9px] rounded border border-green-200 uppercase font-extrabold"><i class="fa-solid fa-check"></i> Confirmed</span>`;
                        } else if(currentStatus === "Rejected") {
                            statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-1 bg-red-50 text-red-500 text-[9px] rounded border border-red-200 uppercase font-extrabold"><i class="fa-solid fa-xmark"></i> Rejected</span>`;
                        } else {
                            statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-1 bg-yellow-50 text-yellow-600 text-[9px] rounded border border-yellow-200 uppercase font-extrabold"><i class="fa-solid fa-clock"></i> ${currentStatus}</span>`;
                        }

                        // MULTIPLE ITEMS RENDERING LOGIC
                        let itemsHTML = "";
                        if (order.items && order.items.length > 0) {
                            itemsHTML = `<div class="mt-3 flex flex-col gap-2">` + order.items.map(item => `
                                <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-100">
                                    <img src="${item.img}" class="w-12 h-12 object-cover rounded border border-gray-200 bg-white">
                                    <div class="flex-grow overflow-hidden">
                                        <p class="font-bold text-gray-800 text-[11px] leading-tight break-words">${item.name}</p>
                                        <p class="text-[10px] text-gray-500 mt-1 font-medium">Size: <span class="text-yellow-600 font-bold">${item.size}</span> | ₹${item.price}</p>
                                    </div>
                                </div>
                            `).join('') + `</div>`;
                        } else {
                            // Fallback for older single items
                            itemsHTML = `
                                <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-100 mt-3">
                                    <img src="${order.img}" class="w-12 h-12 object-cover rounded border border-gray-200 bg-white">
                                    <div class="flex-grow overflow-hidden">
                                        <p class="font-bold text-gray-800 text-[11px] leading-tight break-words">${order.product_name}</p>
                                    </div>
                                </div>
                            `;
                        }

                        myOrdersHTML += `
                            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm mb-4">
                                <div class="border-b border-gray-100 pb-3 mb-3">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Order ID</p>
                                            <p class="text-[11px] text-gray-800 font-bold mt-0.5">${order.id}</p>
                                            <p class="text-[9px] text-gray-400 mt-1 font-medium">${order.date}</p>
                                        </div>
                                        <div class="text-right flex flex-col items-end">
                                            ${statusBadge}
                                            <span class="inline-block mt-2 px-2 py-0.5 bg-gray-100 text-gray-600 text-[9px] font-bold rounded uppercase w-max">${order.payment}</span>
                                        </div>
                                    </div>
                                    ${itemsHTML}
                                </div>
                                <div class="mb-3">
                                    <p class="text-xs text-gray-800 font-bold mb-1 flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-yellow-500"></i> Deliver To</p>
                                    <p class="text-[11px] text-gray-600 ml-5 font-semibold">${order.name}</p>
                                    <p class="text-[11px] text-gray-500 ml-5 leading-relaxed">${order.address}</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                                    <p class="text-xs text-gray-800 font-bold mb-2 flex items-center gap-1.5"><i class="fa-solid fa-wallet text-yellow-500"></i> Payment Details</p>
                                    ${paymentStatus}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    myOrdersHTML = `
                        <div class="text-center p-10 bg-white rounded-xl border border-gray-200 mt-4 shadow-sm">
                            <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-100">
                                <i class="fa-solid fa-box-open text-4xl text-gray-300"></i>
                            </div>
                            <h2 class="text-gray-800 font-extrabold text-lg">No Orders Found</h2>
                            <p class="text-gray-500 text-xs mt-1 mb-6">You haven't placed any orders yet.</p>
                            <button onclick="goHome()" class="bg-white border border-yellow-500 text-yellow-600 px-8 py-2.5 rounded-lg text-sm font-extrabold shadow-sm hover:bg-yellow-50 transition">Start Shopping</button>
                        </div>
                    `;
                }
                appDiv.innerHTML = `
                    <div class="fade-in p-5 pb-24 bg-gray-50 min-h-screen">
                        <div class="flex items-center gap-2 mb-6 border-b border-gray-200 pb-3">
                            <div class="w-1.5 h-6 bg-yellow-500 rounded"></div>
                            <h1 class="text-xl font-extrabold text-gray-800 uppercase tracking-wide">My Orders</h1>
                        </div>
                        ${myOrdersHTML}
                    </div>
                `;
            } catch (error) { appDiv.innerHTML = `<div class="p-10 text-center text-red-500 font-bold">Error connecting to database.</div>`; }
        }

        // Init App 
        initApp();
    </script>
</body>
</html>
