 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .border-gold { border-color: #D4AF37; }
        
        /* Smooth fade-in animation for page transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-black text-gray-200">

    <nav class="bg-zinc-950 p-4 flex justify-between items-center sticky top-0 z-50 border-b border-yellow-600/40 shadow-[0_4px_15px_rgba(212,175,55,0.1)]">
        <div class="flex items-center gap-3">
            <img id="secretLogo" src="240370.jpg" onerror="this.src='https://ui-avatars.com/api/?name=UF&background=000&color=D4AF37'" alt="Unique Fashion" class="w-12 h-12 rounded-full cursor-pointer border-2 border-yellow-500 object-cover shadow-[0_0_10px_rgba(212,175,55,0.4)]">
            <span onclick="goHome()" class="cursor-pointer font-extrabold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-600">
                UNIQUE FASHION
            </span>
        </div>
        <div class="relative cursor-pointer" onclick="showCart()">
            <i class="fa-solid fa-cart-shopping text-xl text-yellow-500"></i>
            <span id="cartCount" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
        </div>
    </nav>

    <div id="app" class="max-w-md mx-auto bg-zinc-900 min-h-screen shadow-2xl pb-20">
        </div>

    <script>
        // --- DATA ---
        const products = [
            { id: 1, name: "Premium Black T-Shirt", price: 499, mrp: 999, discount: "50% OFF", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80" },
            { id: 2, name: "Funky Denim Jacket", price: 1299, mrp: 2599, discount: "50% OFF", img: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=400&q=80" },
            { id: 3, name: "Aesthetic Sneakers", price: 899, mrp: 1499, discount: "40% OFF", img: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=400&q=80" },
            { id: 4, name: "Casual Chinos", price: 799, mrp: 1299, discount: "38% OFF", img: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=400&q=80" }
        ];
        
        const categories = ["T-Shirts", "Shirts", "Jeans", "Shoes", "Accessories"];
        let cart = [];
        // LocalStorage se purane orders nikal lo taaki refresh hone par delete na ho
        let orders = JSON.parse(localStorage.getItem('uf_orders')) || [];

        const appDiv = document.getElementById('app');
        let currentCheckoutItem = null;

        // --- VIEWS RENDERING ---

        function goHome() {
            let catHTML = categories.map(cat => `<div class="flex-shrink-0 bg-black text-yellow-500 px-5 py-2 rounded-full text-sm font-semibold border border-yellow-600/50 shadow-[0_0_5px_rgba(212,175,55,0.2)]">${cat}</div>`).join('');
            
            let prodHTML = products.map(item => `
                <div class="bg-zinc-950 border border-yellow-600/30 rounded-lg shadow-lg relative flex flex-col justify-between overflow-hidden">
                    <button onclick="toggleLike(this)" class="absolute top-2 right-2 text-gray-500 z-10 text-xl bg-black/50 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <div onclick="viewProduct(${item.id})" class="cursor-pointer">
                        <img src="${item.img}" class="w-full h-48 object-cover opacity-90 hover:opacity-100 transition duration-300">
                    </div>
                    <div class="p-3 flex flex-col flex-grow border-t border-yellow-600/20">
                        <h3 onclick="viewProduct(${item.id})" class="text-sm font-semibold truncate text-gray-200 cursor-pointer">${item.name}</h3>
                        <div class="mt-1 flex items-center gap-2">
                            <span class="font-bold text-yellow-500">₹${item.price}</span>
                            <span class="text-xs line-through text-gray-500">₹${item.mrp}</span>
                        </div>
                        <span class="text-xs text-yellow-600 font-bold mt-1">${item.discount}</span>
                        <button onclick="goToCheckout(${item.id})" class="mt-4 block w-full bg-gradient-to-r from-yellow-600 to-yellow-400 hover:from-yellow-500 hover:to-yellow-300 text-black font-extrabold text-center py-2 rounded shadow-[0_0_10px_rgba(212,175,55,0.3)] text-sm transition-all duration-300">
                            BUY NOW
                        </button>
                    </div>
                </div>
            `).join('');

            appDiv.innerHTML = `
                <div class="fade-in">
                    <div class="w-full h-44 bg-zinc-950 flex flex-col items-center justify-center overflow-hidden relative border-b border-yellow-600/30">
                        <div class="absolute inset-0 bg-gradient-to-r from-black via-zinc-900 to-black opacity-80 z-0"></div>
                        <h1 class="relative z-10 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 font-extrabold text-3xl tracking-widest drop-shadow-lg text-center px-2">
                            PREMIUM COLLECTION
                        </h1>
                        <p class="relative z-10 text-yellow-200/70 text-sm mt-2 tracking-widest">UPTO 50% OFF</p>
                    </div>
                    <div class="flex overflow-x-auto gap-3 p-4 no-scrollbar bg-zinc-950 border-b border-yellow-600/20">
                        ${catHTML}
                    </div>
                    <div class="p-4">
                        <h2 class="font-bold text-lg mb-4 text-yellow-500 tracking-wide border-l-4 border-yellow-500 pl-2">TRENDING NOW</h2>
                        <div class="grid grid-cols-2 gap-4">
                            ${prodHTML}
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function viewProduct(id) {
            const product = products.find(p => p.id === id);
            appDiv.innerHTML = `
                <div class="fade-in relative bg-black pb-10">
                    <button onclick="goHome()" class="absolute top-4 left-4 bg-black/70 border border-yellow-500 text-yellow-500 rounded-full p-2 w-10 h-10 z-10 flex items-center justify-center backdrop-blur-sm">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <img src="${product.img}" class="w-full h-[450px] object-cover opacity-90">
                    
                    <div class="p-5 bg-zinc-900 min-h-[40vh]">
                        <h1 class="text-2xl font-bold text-gray-100">${product.name}</h1>
                        <div class="mt-3 flex items-center gap-3">
                            <span class="text-3xl font-extrabold text-yellow-500">₹${product.price}</span>
                            <span class="text-lg line-through text-gray-500">₹${product.mrp}</span>
                            <span class="text-sm text-black font-bold bg-yellow-500 px-2 py-1 rounded">${product.discount}</span>
                        </div>
                        <div class="mt-6 border-t border-yellow-600/30 pt-4">
                            <h3 class="text-yellow-500 font-semibold mb-2">Product Details</h3>
                            <p class="text-gray-400 text-sm leading-relaxed">Experience the ultimate comfort and style with this premium quality apparel. Perfect for everyday wear, designed exclusively for your unique fashion sense.</p>
                        </div>
                    </div>
                    
                    <div class="fixed bottom-0 left-0 w-full bg-zinc-950 border-t border-yellow-600/40 p-3 max-w-md mx-auto flex gap-3 z-50">
                        <button id="addBtn-${product.id}" onclick="addToCart(${product.id})" class="w-1/2 bg-black border border-yellow-500 text-yellow-500 font-bold py-3 rounded hover:bg-yellow-900/20 transition">ADD TO CART</button>
                        <button onclick="goToCheckout(${product.id})" class="w-1/2 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3 rounded text-center block shadow-[0_0_15px_rgba(212,175,55,0.4)]">BUY NOW</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function showCart() {
            if (cart.length === 0) {
                appDiv.innerHTML = `
                    <div class="fade-in p-5 text-center flex flex-col items-center justify-center min-h-[70vh]">
                        <i class="fa-solid fa-cart-shopping text-6xl text-gray-700 mb-4"></i>
                        <h2 class="text-xl text-yellow-500 font-bold mb-4">Your Cart is Empty</h2>
                        <button onclick="goHome()" class="border border-yellow-500 text-yellow-500 px-6 py-2 rounded font-bold">Go Shopping</button>
                    </div>
                `;
                return;
            }

            let cartHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartHTML += `
                    <div class="flex gap-4 items-center bg-zinc-950 p-3 rounded-lg border border-yellow-600/30 mb-3 shadow-md">
                        <img src="${item.img}" class="w-20 h-20 object-cover rounded border border-gray-700">
                        <div class="flex-grow">
                            <p class="font-bold text-gray-200">${item.name}</p>
                            <p class="text-yellow-500 font-semibold mt-1">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-24">
                    <div class="flex items-center gap-3 mb-6 border-b border-yellow-600/30 pb-2">
                        <button onclick="goHome()" class="text-yellow-500"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="text-2xl font-bold text-yellow-500">Your Cart</h1>
                    </div>
                    ${cartHTML}
                    
                    <div class="mt-6 p-4 bg-black border border-yellow-600/50 rounded-lg">
                        <div class="flex justify-between text-gray-300 text-sm mb-2"><span>Subtotal</span><span>₹${total}</span></div>
                        <div class="flex justify-between text-gray-300 text-sm mb-2"><span>Shipping</span><span class="text-green-500">Free</span></div>
                        <div class="flex justify-between font-bold text-yellow-500 text-lg border-t border-gray-800 pt-2 mt-2">
                            <span>Total</span><span>₹${total}</span>
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 w-full bg-zinc-950 border-t border-yellow-600/40 p-3 max-w-md mx-auto z-50">
                        <button onclick="goToCheckout('cart')" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3 rounded text-center block shadow-[0_0_15px_rgba(212,175,55,0.4)] tracking-wide">CHECKOUT (₹${total})</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function goToCheckout(source) {
            let checkoutItems = [];
            let total = 0;
            let productNames = "";

            if (source === 'cart') {
                checkoutItems = cart;
                total = cart.reduce((sum, item) => sum + item.price, 0);
                productNames = cart.map(i => i.name).join(", ");
            } else {
                const product = products.find(p => p.id === source);
                checkoutItems = [product];
                total = product.price;
                productNames = product.name;
            }

            // Save data for confirmation page
            currentCheckoutItem = { names: productNames, price: total };

            let itemsHTML = checkoutItems.map(item => `
                <div class="flex gap-4 items-center mb-3">
                    <img src="${item.img}" class="w-12 h-12 object-cover rounded border border-gray-700">
                    <div>
                        <p class="font-bold text-gray-200 text-sm">${item.name}</p>
                        <p class="text-yellow-500 text-sm font-semibold">₹${item.price}</p>
                    </div>
                </div>
            `).join('');

            appDiv.innerHTML = `
                <div class="fade-in p-5">
                    <div class="flex items-center gap-3 mb-6 border-b border-yellow-600/30 pb-2">
                        <button onclick="goHome()" class="text-yellow-500"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="text-2xl font-bold text-yellow-500">Checkout</h1>
                    </div>
                    
                    <div class="bg-zinc-950 p-4 rounded-lg border border-yellow-600/30 mb-6 shadow-md">
                        ${itemsHTML}
                        <div class="border-t border-yellow-600/30 mt-3 pt-3 flex justify-between font-bold text-lg text-yellow-500">
                            <span>Total to Pay:</span>
                            <span>₹${total}</span>
                        </div>
                    </div>

                    <form id="checkoutForm" onsubmit="confirmOrder(event)" class="flex flex-col gap-5">
                        <div>
                            <h2 class="font-bold text-gray-300 mb-3"><i class="fa-solid fa-location-dot text-yellow-500 mr-2"></i>Shipping Details</h2>
                            <input type="text" id="custName" placeholder="Full Name" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 rounded w-full mb-3">
                            <input type="tel" id="custPhone" placeholder="Phone Number" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 rounded w-full mb-3">
                            <textarea id="custAddress" placeholder="Complete Address (House No, Street, City)" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 rounded w-full" rows="3"></textarea>
                        </div>
                        
                        <div>
                            <h2 class="font-bold text-gray-300 mt-2 mb-3"><i class="fa-solid fa-wallet text-yellow-500 mr-2"></i>Payment Method</h2>
                            <div class="flex items-center gap-3 bg-zinc-950 p-3 rounded border border-yellow-600/50 mb-2">
                                <input type="radio" id="cod" name="payment" value="COD" checked class="accent-yellow-500 w-4 h-4">
                                <label for="cod" class="text-gray-200 font-medium">Cash on Delivery (COD)</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="mt-2 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-4 rounded shadow-[0_0_15px_rgba(212,175,55,0.4)] w-full text-lg tracking-wide">
                            PLACE ORDER
                        </button>
                    </form>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function confirmOrder(event) {
            event.preventDefault();
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            
            // Save order for admin panel
            const newOrder = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                name: name,
                phone: phone,
                address: address,
                payment: "COD",
                product_name: currentCheckoutItem.names,
                price: currentCheckoutItem.price
            };
            
            orders.push(newOrder);
            localStorage.setItem('uf_orders', JSON.stringify(orders)); // Save to local storage
            
            // Clear cart
            cart = [];
            updateCartBadge();

            appDiv.innerHTML = `
                <div class="fade-in flex flex-col items-center justify-center min-h-[70vh] p-4 text-center">
                    <div class="w-24 h-24 bg-zinc-950 border-2 border-yellow-500 text-yellow-500 rounded-full flex items-center justify-center text-5xl mb-6 shadow-[0_0_20px_rgba(212,175,55,0.3)]">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">Order Confirmed!</h1>
                    <p class="text-gray-400 mt-4 text-lg">Thank you, <span class="text-white font-semibold">${name}</span>.</p>
                    <p class="text-gray-400 mt-1">Your order for <b class="text-yellow-500">${currentCheckoutItem.names}</b> is being processed.</p>
                    
                    <div class="mt-6 bg-zinc-950 border border-yellow-600/30 p-4 rounded-lg w-full max-w-xs inline-block">
                        <p class="text-sm text-gray-400">Amount to pay on delivery</p>
                        <p class="text-2xl font-bold text-yellow-500">₹${currentCheckoutItem.price}</p>
                    </div>
                    
                    <button onclick="goHome()" class="mt-8 border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black px-8 py-3 rounded font-bold shadow-md transition-all duration-300">Continue Shopping</button>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function renderAdmin() {
            let ordersHTML = "";
            
            if (orders.length > 0) {
                // Reverse to show newest first
                [...orders].reverse().forEach(order => {
                    ordersHTML += `
                        <div class="border border-yellow-600/30 rounded-lg p-4 bg-zinc-950 shadow-[0_0_10px_rgba(0,0,0,0.5)]">
                            <div class="flex justify-between items-start mb-2">
                                <p class="font-bold text-yellow-500 text-lg">${order.product_name}</p>
                                <span class="bg-green-900/50 text-green-400 text-xs px-2 py-1 rounded border border-green-700">New</span>
                            </div>
                            <div class="space-y-1 mt-3">
                                <p class="text-xs text-gray-500 border-b border-gray-800 pb-1 mb-2">${order.date}</p>
                                <p class="text-sm text-gray-300"><i class="fa-solid fa-user w-5 text-gray-500"></i> ${order.name} (${order.phone})</p>
                                <p class="text-sm text-gray-300"><i class="fa-solid fa-location-dot w-5 text-gray-500"></i> ${order.address}</p>
                                <p class="text-sm text-gray-300"><i class="fa-solid fa-money-bill w-5 text-gray-500"></i> ${order.payment} - <span class="font-bold text-white">₹${order.price}</span></p>
                            </div>
                        </div>
                    `;
                });
            } else {
                ordersHTML = `
                    <div class="bg-zinc-950 border border-dashed border-gray-700 p-8 text-center rounded-lg mt-10">
                        <i class="fa-solid fa-box-open text-4xl text-gray-600 mb-3"></i>
                        <p class="text-gray-500 italic">No orders yet.</p>
                    </div>
                `;
            }

            appDiv.innerHTML = `
                <div class="fade-in p-5">
                    <h1 class="text-3xl font-bold mb-6 text-yellow-500 border-b border-yellow-600/30 pb-3">
                        <i class="fa-solid fa-crown mr-2"></i> Admin Dashboard
                    </h1>
                    
                    <div class="flex justify-between items-center mt-4 mb-4">
                        <h2 class="text-xl font-semibold text-gray-200">Total Orders: ${orders.length}</h2>
                        <button onclick="clearOrders()" class="text-sm text-red-500 border border-red-900 px-2 py-1 rounded">Clear All</button>
                    </div>
                    
                    <div class="flex flex-col gap-4">
                        ${ordersHTML}
                    </div>
                    
                    <div class="mt-10 text-center">
                        <button onclick="goHome()" class="text-yellow-500 border-b border-yellow-500 pb-1 hover:text-yellow-400"><i class="fa-solid fa-arrow-left mr-2"></i> Back to Store</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        // --- HELPER FUNCTIONS ---

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartBadge();
            
            // Change button text temporarily to show success
            const btn = document.getElementById(`addBtn-${id}`);
            if(btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> ADDED';
                btn.classList.add('bg-green-900', 'text-white', 'border-green-500');
                btn.classList.remove('bg-black', 'text-yellow-500', 'border-yellow-500');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-900', 'text-white', 'border-green-500');
                    btn.classList.add('bg-black', 'text-yellow-500', 'border-yellow-500');
                }, 1500);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartBadge();
            showCart(); // Refresh cart view
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartCount');
            if (cart.length > 0) {
                badge.innerText = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleLike(element) {
            element.classList.toggle('text-red-500');
            element.classList.toggle('text-gray-500');
        }

        function clearOrders() {
            if(confirm("Are you sure you want to delete all orders?")) {
                orders = [];
                localStorage.removeItem('uf_orders');
                renderAdmin();
            }
        }

        // --- SECRET ADMIN LOGIC ---
        let clicks = 0;
        document.getElementById('secretLogo').addEventListener('click', () => {
            clicks++;
            if(clicks >= 5) {
                clicks = 0; // reset
                renderAdmin();
            }
            // Reset click count if they click slowly
            setTimeout(() => { clicks = 0; }, 2000);
        });

        // --- INITIALIZATION ---
        // Start the app by showing the home page
        goHome();

    </script>
</body>
</html>
