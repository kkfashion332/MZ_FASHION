<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MZ Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-black text-gray-200">

    <nav class="bg-zinc-950 p-4 flex justify-between items-center sticky top-0 z-50 border-b border-yellow-600/40 shadow-[0_4px_15px_rgba(212,175,55,0.1)]">
        <div class="flex items-center gap-3">
            <img id="secretLogo" src="logo.png" onerror="this.src='https://ui-avatars.com/api/?name=MZ&background=000&color=D4AF37'" alt="MZ Fashion" class="w-10 h-10 rounded-full cursor-pointer border border-yellow-500 object-cover shadow-[0_0_10px_rgba(212,175,55,0.4)]">
            <span onclick="goHome()" class="cursor-pointer font-bold text-base tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-600">
                MZ FASHION
            </span>
        </div>
        <div class="flex items-center gap-5">
            <div class="cursor-pointer" onclick="showMyOrders()">
                <i class="fa-solid fa-user text-xl text-yellow-500"></i>
            </div>
            <div class="relative cursor-pointer" onclick="showCart()">
                <i class="fa-solid fa-cart-shopping text-xl text-yellow-500"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
            </div>
        </div>
    </nav>

    <div id="app" class="max-w-md mx-auto bg-zinc-900 min-h-screen shadow-2xl pb-20 relative">
        </div>

    <div id="imageModalContainer"></div>

    <script>
        // --- DATA ---
        const categories = [
            { name: "All", img: "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=150&q=80" },
            { name: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=150&q=80" },
            { name: "Shirts", img: "https://images.unsplash.com/photo-1596755094514-f87e32f85ec8?w=150&q=80" },
            { name: "Jeans", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=150&q=80" },
            { name: "Shoes", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=150&q=80" }
        ];

        const products = [
            { id: 1, name: "Premium Black T-Shirt", price: 499, mrp: 999, discount: "50% OFF", category: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80" },
            { id: 2, name: "Funky Denim Jacket", price: 1299, mrp: 2599, discount: "50% OFF", category: "Shirts", img: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=400&q=80" },
            { id: 3, name: "Aesthetic Sneakers", price: 899, mrp: 1499, discount: "40% OFF", category: "Shoes", img: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=400&q=80" },
            { id: 4, name: "Casual Chinos", price: 799, mrp: 1299, discount: "38% OFF", category: "Jeans", img: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=400&q=80" }
        ];
        
        let cart = [];
        let orders = JSON.parse(localStorage.getItem('mz_orders')) || [];
        const appDiv = document.getElementById('app');
        let currentCheckoutItem = null;
        let activeCategory = "All";

        // --- VIEWS ---

        function goHome() {
            let displayProducts = products;
            if(activeCategory !== "All") {
                displayProducts = products.filter(p => p.category === activeCategory);
            }

            // Categories updated to Grid (5 columns horizontally)
            let catHTML = categories.map(cat => `
                <div onclick="filterCategory('${cat.name}')" class="flex flex-col items-center gap-1 cursor-pointer w-full mt-2">
                    <div class="w-12 h-12 md:w-14 md:h-14 rounded-full overflow-hidden border-2 ${activeCategory === cat.name ? 'border-yellow-400 shadow-[0_0_10px_rgba(212,175,55,0.8)]' : 'border-gray-600'} transition-all mx-auto">
                        <img src="${cat.img}" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[9px] md:text-[10px] ${activeCategory === cat.name ? 'text-yellow-400 font-bold' : 'text-gray-400 font-medium'} text-center w-full uppercase break-words">${cat.name}</span>
                </div>
            `).join('');
            
            // Products (Like option restored)
            let prodHTML = displayProducts.map(item => `
                <div class="bg-zinc-950 border border-yellow-600/30 rounded-lg shadow-lg relative flex flex-col justify-between overflow-hidden">
                    
                    <button onclick="toggleLike(this)" class="absolute top-2 right-2 text-gray-500 z-10 text-xl bg-black/60 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm shadow-md transition-colors">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                    <div onclick="viewProduct(${item.id})" class="cursor-pointer relative">
                        <img src="${item.img}" class="w-full h-44 object-cover opacity-90 hover:opacity-100 transition duration-300">
                    </div>
                    
                    <div class="p-3 flex flex-col flex-grow border-t border-yellow-600/20">
                        <h3 onclick="viewProduct(${item.id})" class="text-sm font-semibold truncate text-gray-200 cursor-pointer">${item.name}</h3>
                        <div class="mt-1 flex items-center gap-2">
                            <span class="font-bold text-yellow-500">₹${item.price}</span>
                            <span class="text-xs line-through text-gray-500">₹${item.mrp}</span>
                        </div>
                        <span class="text-[10px] text-yellow-600 font-bold mt-1 bg-yellow-900/20 px-1 w-max rounded">${item.discount}</span>
                        
                        <div class="flex gap-2 mt-3">
                            <button id="addBtn-${item.id}" onclick="addToCart(${item.id})" class="w-1/2 bg-zinc-800 border border-yellow-500 text-yellow-500 font-bold py-1.5 rounded text-xs hover:bg-yellow-900/30 transition shadow-sm">CART</button>
                            <button onclick="goToCheckout(${item.id})" class="w-1/2 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-1.5 rounded shadow-[0_0_10px_rgba(212,175,55,0.4)] text-xs transition-all duration-300">BUY NOW</button>
                        </div>
                    </div>
                </div>
            `).join('');

            if(displayProducts.length === 0) {
                prodHTML = `<div class="col-span-2 text-center text-gray-500 py-10">No products found in this category.</div>`;
            }

            appDiv.innerHTML = `
                <div class="fade-in">
                    <div class="w-full h-44 mt-4 bg-zinc-950 flex flex-col items-center justify-center overflow-hidden relative border-y border-yellow-600/30">
                        <img src="256328.jpg" alt="Banner" class="w-full h-full object-cover opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    </div>

                    <div class="grid grid-cols-5 gap-2 p-3 bg-zinc-950 border-b border-yellow-600/20 mt-2">
                        ${catHTML}
                    </div>
                    
                    <div class="p-4">
                        <h2 class="font-bold text-lg mb-4 text-yellow-500 tracking-wide border-l-4 border-yellow-500 pl-2 uppercase">${activeCategory} Collection</h2>
                        <div class="grid grid-cols-2 gap-4">
                            ${prodHTML}
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function filterCategory(catName) {
            activeCategory = catName;
            goHome();
        }

        // Like toggle logic
        function toggleLike(btn) {
            btn.classList.toggle('text-red-500');
            btn.classList.toggle('text-gray-500');
        }

        // --- PRODUCT PAGE ---
        function viewProduct(id) {
            const product = products.find(p => p.id === id);
            appDiv.innerHTML = `
                <div class="fade-in relative bg-black pb-24">
                    <button onclick="goHome()" class="absolute top-4 left-4 bg-black/70 border border-yellow-500 text-yellow-500 rounded-full w-10 h-10 z-10 flex items-center justify-center backdrop-blur-sm shadow-lg">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    
                    <div onclick="openImage('${product.img}')" class="relative cursor-zoom-in">
                        <img src="${product.img}" class="w-full h-[450px] object-cover opacity-90">
                        <div class="absolute bottom-3 right-3 bg-black/70 rounded-full w-8 h-8 flex items-center justify-center text-yellow-500 border border-yellow-500/50 shadow-lg">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </div>
                    
                    <div class="p-5 bg-zinc-900 min-h-[40vh]">
                        <h1 class="text-2xl font-bold text-gray-100">${product.name}</h1>
                        <div class="mt-3 flex items-center gap-3">
                            <span class="text-3xl font-extrabold text-yellow-500">₹${product.price}</span>
                            <span class="text-lg line-through text-gray-500">₹${product.mrp}</span>
                            <span class="text-sm text-black font-bold bg-yellow-500 px-2 py-1 rounded">${product.discount}</span>
                        </div>
                        <div class="mt-6 border-t border-yellow-600/30 pt-4">
                            <h3 class="text-yellow-500 font-semibold mb-2">Product Details</h3>
                            <p class="text-gray-400 text-sm leading-relaxed">Experience the ultimate comfort and style with this premium quality apparel. Perfect for everyday wear, designed exclusively for your unique fashion sense.</p>
                        </div>
                    </div>
                    
                    <div class="fixed bottom-0 left-0 w-full bg-zinc-950 border-t border-yellow-600/40 p-3 max-w-md mx-auto flex gap-3 z-50 shadow-[0_-4px_15px_rgba(0,0,0,0.5)]">
                        <button id="addBtn-${product.id}" onclick="addToCart(${product.id})" class="w-1/2 bg-black border border-yellow-500 text-yellow-500 font-bold py-3 rounded hover:bg-yellow-900/20 transition text-sm">ADD TO CART</button>
                        <button onclick="goToCheckout(${product.id})" class="w-1/2 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3 rounded text-center block shadow-[0_0_15px_rgba(212,175,55,0.4)] text-sm">BUY NOW</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function openImage(url) {
            const container = document.getElementById('imageModalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center fade-in backdrop-blur-md">
                    <button onclick="closeImage()" class="absolute top-6 right-6 text-yellow-500 text-xl z-[101] bg-black border-2 border-yellow-500 w-10 h-10 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.5)]">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <img src="${url}" class="max-w-full max-h-full object-contain p-2">
                </div>
            `;
        }
        function closeImage() {
            document.getElementById('imageModalContainer').innerHTML = '';
        }

        // --- CART & CHECKOUT ---
        function showCart() {
            if (cart.length === 0) {
                appDiv.innerHTML = `
                    <div class="fade-in p-5 text-center flex flex-col items-center justify-center min-h-[70vh]">
                        <i class="fa-solid fa-cart-shopping text-6xl text-gray-700 mb-4"></i>
                        <h2 class="text-xl text-yellow-500 font-bold mb-4">Your Cart is Empty</h2>
                        <button onclick="goHome()" class="border border-yellow-500 text-yellow-500 px-6 py-2 rounded font-bold">Go Shopping</button>
                    </div>
                `;
                return;
            }

            let cartHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartHTML += `
                    <div class="flex gap-4 items-center bg-zinc-950 p-3 rounded-lg border border-yellow-600/30 mb-3 shadow-md">
                        <img src="${item.img}" class="w-20 h-20 object-cover rounded border border-gray-700">
                        <div class="flex-grow">
                            <p class="font-bold text-gray-200 text-sm">${item.name}</p>
                            <p class="text-yellow-500 font-semibold mt-1">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-24">
                    <div class="flex items-center gap-3 mb-6 border-b border-yellow-600/30 pb-2">
                        <button onclick="goHome()" class="text-yellow-500"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="text-xl font-bold text-yellow-500">Your Cart</h1>
                    </div>
                    ${cartHTML}
                    
                    <div class="mt-6 p-4 bg-black border border-yellow-600/50 rounded-lg">
                        <div class="flex justify-between text-gray-300 text-sm mb-2"><span>Subtotal</span><span>₹${total}</span></div>
                        <div class="flex justify-between font-bold text-yellow-500 text-lg border-t border-gray-800 pt-2 mt-2">
                            <span>Total</span><span>₹${total}</span>
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 w-full bg-zinc-950 border-t border-yellow-600/40 p-3 max-w-md mx-auto z-50">
                        <button onclick="goToCheckout('cart')" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3 rounded text-center block shadow-[0_0_15px_rgba(212,175,55,0.4)] tracking-wide">CHECKOUT (₹${total})</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function goToCheckout(source) {
            let checkoutItems = [];
            let total = 0;
            let productNames = "";
            let primaryImg = "";

            if (source === 'cart') {
                checkoutItems = cart;
                total = cart.reduce((sum, item) => sum + item.price, 0);
                productNames = cart.map(i => i.name).join(", ");
                primaryImg = cart[0].img;
            } else {
                const product = products.find(p => p.id === source);
                checkoutItems = [product];
                total = product.price;
                productNames = product.name;
                primaryImg = product.img;
            }

            // Save info to be used when confirming order
            currentCheckoutItem = { names: productNames, price: total, img: primaryImg };

            let itemsHTML = checkoutItems.map(item => `
                <div class="flex gap-4 items-center mb-3 border-b border-gray-800 pb-2 last:border-0 last:pb-0">
                    <img src="${item.img}" class="w-12 h-12 object-cover rounded border border-gray-700">
                    <div>
                        <p class="font-bold text-gray-200 text-sm">${item.name}</p>
                        <p class="text-yellow-500 text-sm font-semibold">₹${item.price}</p>
                    </div>
                </div>
            `).join('');

            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-20">
                    <div class="flex items-center gap-3 mb-6 border-b border-yellow-600/30 pb-2">
                        <button onclick="goHome()" class="text-yellow-500 text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="text-xl font-bold text-yellow-500">Checkout</h1>
                    </div>
                    
                    <div class="bg-zinc-950 p-4 rounded-lg border border-yellow-600/30 mb-6 shadow-md">
                        ${itemsHTML}
                        <div class="border-t border-yellow-600/30 mt-3 pt-3 flex justify-between font-bold text-lg text-yellow-500">
                            <span>Total to Pay:</span>
                            <span>₹${total}</span>
                        </div>
                    </div>

                    <form id="checkoutForm" onsubmit="confirmOrder(event)" class="flex flex-col gap-4">
                        <div>
                            <h2 class="font-bold text-gray-300 mb-3 text-sm"><i class="fa-solid fa-location-dot text-yellow-500 mr-2"></i>Shipping Details</h2>
                            <input type="text" id="custName" placeholder="Full Name" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 rounded w-full mb-3 text-sm">
                            <input type="tel" id="custPhone" placeholder="Phone Number" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 rounded w-full mb-3 text-sm">
                            <textarea id="custAddress" placeholder="Complete Address (House No, Street, City)" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 rounded w-full text-sm" rows="3"></textarea>
                        </div>
                        
                        <div>
                            <h2 class="font-bold text-gray-300 mt-2 mb-3 text-sm"><i class="fa-solid fa-wallet text-yellow-500 mr-2"></i>Payment Method</h2>
                            <div class="flex items-center gap-3 bg-zinc-950 p-3 rounded border border-gray-700 mb-2">
                                <input type="radio" id="prepaid" name="payment" value="Prepaid" onchange="renderPaymentUI()" class="accent-yellow-500 w-4 h-4">
                                <label for="prepaid" class="text-gray-200 font-medium text-sm">Prepaid (Full Payment)</label>
                            </div>
                            <div class="flex items-center gap-3 bg-zinc-950 p-3 rounded border border-gray-700 mb-2">
                                <input type="radio" id="cod" name="payment" value="COD" onchange="renderPaymentUI()" class="accent-yellow-500 w-4 h-4" checked>
                                <label for="cod" class="text-gray-200 font-medium text-sm">Cash on Delivery (C.O.D)</label>
                            </div>
                            <div id="paymentUI" class="mt-4 p-4 bg-black border border-yellow-500 rounded-lg shadow-[0_0_10px_rgba(212,175,55,0.2)]"></div>
                        </div>
                        
                        <button type="submit" class="mt-4 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-4 rounded shadow-[0_0_15px_rgba(212,175,55,0.4)] w-full text-lg tracking-wide">
                            PLACE ORDER
                        </button>
                    </form>
                </div>
            `;
            window.scrollTo(0,0);
            renderPaymentUI();
        }

        function renderPaymentUI() {
            const isCOD = document.getElementById('cod').checked;
            const uiDiv = document.getElementById('paymentUI');
            const totalAmount = currentCheckoutItem.price;
            
            const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=dummy@upi&pn=MZFASHION";

            if (!isCOD) {
                uiDiv.innerHTML = `
                    <p class="text-center text-sm text-gray-300 mb-2">Scan QR to pay Full Amount</p>
                    <p class="text-center font-bold text-xl text-yellow-500 mb-4">₹${totalAmount}</p>
                    <div class="flex justify-center mb-4">
                        <img src="${qrUrl}" class="w-32 h-32 border-4 border-yellow-500 rounded p-1 bg-white shadow-lg">
                    </div>
                    <p class="text-xs text-center text-gray-500">After payment, click Place Order.</p>
                `;
            } else {
                const tokenAmount = Math.round(totalAmount * 0.30);
                uiDiv.innerHTML = `
                    <div class="bg-yellow-900/30 border border-yellow-600/50 p-2 rounded mb-3 text-center">
                        <p class="text-xs text-yellow-200">For C.O.D, 30% advance token is required.</p>
                        <p class="font-bold text-lg text-yellow-500 mt-1">Token Amount: ₹${tokenAmount}</p>
                    </div>
                    <div class="flex justify-center mb-4">
                        <img src="${qrUrl}" class="w-32 h-32 border-4 border-yellow-500 rounded p-1 bg-white shadow-lg">
                    </div>
                    <p class="text-xs text-center text-gray-400 mb-3">Scan & Pay Token, then send screenshot on WhatsApp.</p>
                    
                    <a href="https://wa.me/919982437489?text=Hello%20MZ%20Fashion,%20here%20is%20my%20token%20payment%20screenshot" target="_blank" class="flex w-full items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(34,197,94,0.6)] animate-pulse transition">
                        <i class="fa-brands fa-whatsapp text-2xl"></i> SEND SCREENSHOT
                    </a>
                `;
            }
        }

        function confirmOrder(event) {
            event.preventDefault();
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const paymentType = document.getElementById('cod').checked ? "COD" : "Prepaid";
            
            const newOrder = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                name: name,
                phone: phone,
                address: address,
                payment: paymentType,
                product_name: currentCheckoutItem.names,
                price: currentCheckoutItem.price,
                img: currentCheckoutItem.img // Saving image for "My Orders" page
            };
            
            orders.push(newOrder);
            localStorage.setItem('mz_orders', JSON.stringify(orders));
            
            cart = [];
            updateCartBadge();

            appDiv.innerHTML = `
                <div class="fade-in flex flex-col items-center justify-center min-h-[70vh] p-4 text-center">
                    <div class="w-20 h-20 bg-zinc-950 border-2 border-yellow-500 text-yellow-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-[0_0_20px_rgba(212,175,55,0.3)]">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">Order Placed!</h1>
                    <p class="text-gray-400 mt-4 text-sm">Thank you, <span class="text-white font-semibold">${name}</span>.</p>
                    <p class="text-gray-400 mt-1 text-sm">Order for <b class="text-yellow-500">${currentCheckoutItem.names}</b> is processing.</p>
                    
                    <button onclick="showMyOrders()" class="mt-6 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black px-8 py-3 rounded font-bold shadow-md transition-all w-full max-w-xs">View My Orders</button>
                    <button onclick="goHome()" class="mt-3 border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black px-8 py-3 rounded font-bold transition-all w-full max-w-xs">Continue Shopping</button>
                </div>
            `;
            window.scrollTo(0,0);
        }

        // --- CUSTOMER "MY ORDERS" PAGE ---
        function showMyOrders() {
            let myOrdersHTML = "";
            
            if (orders.length > 0) {
                // Show newest orders first
                [...orders].reverse().forEach(order => {
                    let paymentStatus = "";
                    let tokenAmount = 0;
                    let remainingAmount = 0;

                    if(order.payment === "COD") {
                        tokenAmount = Math.round(order.price * 0.30);
                        remainingAmount = order.price - tokenAmount;
                        paymentStatus = `
                            <p class="text-xs text-gray-400 mt-1">Total: ₹${order.price}</p>
                            <p class="text-xs text-green-500 font-semibold">Paid Token: ₹${tokenAmount}</p>
                            <p class="text-xs text-red-400 font-semibold">To Pay on Delivery: ₹${remainingAmount}</p>
                        `;
                    } else {
                        paymentStatus = `
                            <p class="text-xs text-gray-400 mt-1">Total: ₹${order.price}</p>
                            <p class="text-xs text-green-500 font-semibold">Paid: ₹${order.price} (Full Payment)</p>
                        `;
                    }

                    myOrdersHTML += `
                        <div class="bg-zinc-950 border border-yellow-600/30 rounded-lg p-4 shadow-md mb-4">
                            <div class="flex gap-4 border-b border-gray-800 pb-3 mb-3">
                                <img src="${order.img}" class="w-20 h-20 object-cover rounded border border-gray-700">
                                <div class="flex-grow">
                                    <p class="font-bold text-gray-200 text-sm">${order.product_name}</p>
                                    <p class="text-[10px] text-gray-500 mt-1">${order.date}</p>
                                    <span class="inline-block mt-2 px-2 py-0.5 bg-yellow-900/30 text-yellow-500 text-[10px] rounded border border-yellow-600/50 uppercase">${order.payment}</span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <p class="text-sm text-gray-300 font-semibold"><i class="fa-solid fa-location-dot text-yellow-500 mr-1 w-4"></i> Deliver To:</p>
                                <p class="text-xs text-gray-400 ml-5">${order.name}</p>
                                <p class="text-xs text-gray-400 ml-5">${order.address}</p>
                                <p class="text-xs text-gray-400 ml-5">${order.phone}</p>
                            </div>
                            
                            <div class="bg-black p-3 rounded border border-gray-800">
                                <p class="text-sm text-gray-300 font-semibold mb-1"><i class="fa-solid fa-wallet text-yellow-500 mr-1 w-4"></i> Payment Info:</p>
                                ${paymentStatus}
                            </div>
                            
                            <a href="https://wa.me/919982437489?text=Hello,%20I%20have%20an%20issue%20with%20my%20order%20of%20${order.product_name}" target="_blank" class="mt-4 flex w-full items-center justify-center gap-2 bg-green-500/10 hover:bg-green-500/20 border border-green-500 text-green-500 font-bold py-2 px-4 rounded transition text-xs">
                                <i class="fa-brands fa-whatsapp text-lg"></i> CONTACT SUPPORT
                            </a>
                        </div>
                    `;
                });
            } else {
                myOrdersHTML = `
                    <div class="text-center p-10 bg-zinc-950 rounded-lg border border-gray-800 mt-4">
                        <i class="fa-solid fa-box-open text-5xl text-gray-600 mb-4"></i>
                        <h2 class="text-gray-400 font-semibold">No Orders Found</h2>
                        <p class="text-xs text-gray-500 mt-2">Looks like you haven't bought anything yet.</p>
                        <button onclick="goHome()" class="mt-4 border border-yellow-500 text-yellow-500 px-6 py-2 rounded text-sm font-bold">Start Shopping</button>
                    </div>
                `;
            }

            appDiv.innerHTML = `
                <div class="fade-in p-4 pb-20">
                    <div class="flex items-center gap-3 mb-6 border-b border-yellow-600/30 pb-2">
                        <button onclick="goHome()" class="text-yellow-500 text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="text-xl font-bold text-yellow-500">My Orders</h1>
                    </div>
                    ${myOrdersHTML}
                </div>
            `;
            window.scrollTo(0,0);
        }

        // Add to Cart
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartBadge();
            
            const btn = document.getElementById(`addBtn-${id}`);
            if(btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> ADDED';
                btn.classList.add('bg-green-600', 'text-white', 'border-green-500');
                btn.classList.remove('bg-zinc-800', 'text-yellow-500', 'border-yellow-500');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600', 'text-white', 'border-green-500');
                    btn.classList.add('bg-zinc-800', 'text-yellow-500', 'border-yellow-500');
                }, 1500);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartBadge();
            showCart();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartCount');
            if (cart.length > 0) {
                badge.innerText = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- SECRET ADMIN PANEL ---
        function renderAdmin() {
            let ordersHTML = "";
            if (orders.length > 0) {
                [...orders].reverse().forEach(order => {
                    ordersHTML += `
                        <div class="border border-yellow-600/30 rounded-lg p-4 bg-zinc-950 shadow-[0_0_10px_rgba(0,0,0,0.5)]">
                            <div class="flex justify-between items-start mb-2">
                                <p class="font-bold text-yellow-500 text-sm">${order.product_name}</p>
                            </div>
                            <div class="space-y-1 mt-3">
                                <p class="text-[10px] text-gray-500 border-b border-gray-800 pb-1 mb-2">${order.date}</p>
                                <p class="text-xs text-gray-300"><i class="fa-solid fa-user w-4 text-gray-500"></i> ${order.name} (${order.phone})</p>
                                <p class="text-xs text-gray-300"><i class="fa-solid fa-location-dot w-4 text-gray-500"></i> ${order.address}</p>
                                <p class="text-xs text-gray-300"><i class="fa-solid fa-money-bill w-4 text-gray-500"></i> ${order.payment} - <span class="font-bold text-white">₹${order.price}</span></p>
                            </div>
                        </div>
                    `;
                });
            } else {
                ordersHTML = `<div class="bg-zinc-950 border border-dashed border-gray-700 p-8 text-center rounded-lg mt-5"><p class="text-gray-500 italic">No orders yet.</p></div>`;
            }

            appDiv.innerHTML = `
                <div class="fade-in p-5">
                    <h1 class="text-2xl font-bold mb-4 text-yellow-500 border-b border-yellow-600/30 pb-3">Admin Panel</h1>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-semibold text-gray-200">Total Orders: ${orders.length}</h2>
                        <button onclick="clearOrders()" class="text-[10px] text-red-500 border border-red-900 px-2 py-1 rounded">Clear All</button>
                    </div>
                    <div class="flex flex-col gap-3">${ordersHTML}</div>
                    <div class="mt-8 text-center">
                        <button onclick="goHome()" class="text-yellow-500 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Store</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function clearOrders() {
            if(confirm("Delete all orders?")) {
                orders = [];
                localStorage.removeItem('mz_orders');
                renderAdmin();
            }
        }

        let clicks = 0;
        document.getElementById('secretLogo').addEventListener('click', () => {
            clicks++;
            if(clicks >= 5) {
                clicks = 0;
                renderAdmin();
            }
            setTimeout(() => { clicks = 0; }, 2000);
        });

        // Initialize App
        goHome();
    </script>
</body>
</html>
