<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MZ Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .content-padding { padding-bottom: 90px; }
        .size-radio:checked + label {
            background-color: #eab308;
            color: #000;
            border-color: #eab308;
        }
        select option {
            background-color: #000;
            color: #d1d5db;
        }
    </style>
</head>
<body class="bg-black text-gray-200">

    <!-- Top Navbar -->
    <nav id="topNav" class="hidden bg-zinc-950 p-4 flex justify-between items-center sticky top-0 z-50 border-b border-yellow-600/40 shadow-[0_4px_15px_rgba(212,175,55,0.1)]">
        <div class="flex items-center gap-3 w-full justify-center relative">
            <img id="secretLogo" src="logo.png" onerror="this.src='https://ui-avatars.com/api/?name=MZ&background=000&color=D4AF37'" alt="MZ Fashion" class="absolute left-0 w-10 h-10 rounded-full cursor-pointer border border-yellow-500 object-cover shadow-[0_0_10px_rgba(212,175,55,0.4)]">
            <span onclick="goHome()" class="cursor-pointer font-bold text-lg tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-600">
                MZ FASHION
            </span>
        </div>
    </nav>

    <!-- Main App Container -->
    <div id="app" class="max-w-md mx-auto bg-zinc-900 min-h-screen shadow-2xl content-padding relative">
        <div class="min-h-screen flex flex-col items-center justify-center text-yellow-500">
            <i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i>
            <p class="font-bold tracking-widest">LOADING STORE...</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div id="bottomNav" class="hidden fixed bottom-0 left-0 w-full bg-zinc-950 border-t border-yellow-600/40 p-2 max-w-md mx-auto z-[60] flex justify-around items-center h-16 shadow-[0_-4px_15px_rgba(0,0,0,0.3)]">
        <div onclick="showLikes()" class="flex flex-col items-center w-1/5 text-gray-500 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-heart text-lg"></i><span class="text-[9px] mt-1 font-semibold">Likes</span></div>
        <div onclick="showMyOrders()" class="flex flex-col items-center w-1/5 text-gray-500 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-box text-lg"></i><span class="text-[9px] mt-1 font-semibold">Orders</span></div>
        <div class="w-1/5 flex justify-center relative">
            <div onclick="goHome()" class="absolute -top-10 w-14 h-14 bg-gradient-to-r from-yellow-600 to-yellow-400 rounded-full flex items-center justify-center text-black text-2xl shadow-[0_0_15px_rgba(212,175,55,0.5)] border-4 border-black cursor-pointer z-50 transition-transform active:scale-95"><i class="fa-solid fa-house"></i></div>
        </div>
        <div onclick="showCart()" class="flex flex-col items-center w-1/5 text-gray-500 hover:text-yellow-500 cursor-pointer relative transition-colors"><i class="fa-solid fa-cart-shopping text-lg"></i><span class="text-[9px] mt-1 font-semibold">Cart</span><span id="bottomCartCount" class="absolute -top-1 right-2 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span></div>
        <div onclick="showProfile()" class="flex flex-col items-center w-1/5 text-gray-500 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-user text-lg"></i><span class="text-[9px] mt-1 font-semibold">Profile</span></div>
    </div>

    <div id="imageModalContainer"></div>

    <script>
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDYbppZ6nR4qs9tTZswSnVwurPI-Z5EqJ8",
            authDomain: "mzfashion.firebaseapp.com",
            databaseURL: "https://mzfashion-default-rtdb.firebaseio.com",
            projectId: "mzfashion",
            storageBucket: "mzfashion.firebasestorage.app",
            messagingSenderId: "355960541786",
            appId: "1:355960541786:web:df4b50d44291d0dd0c3e63"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- DYNAMIC DATA STATE ---
        let categories = []; 
        let products = [];
        let banners = [];
        let paymentSettings = { qr_url: "", upi_id: "", whatsapp: "919982437489" };
        
        let currentUser = JSON.parse(localStorage.getItem('mz_currentUser')) || null;
        let cart = JSON.parse(localStorage.getItem('mz_cart')) || [];
        let likedItems = JSON.parse(localStorage.getItem('mz_likes')) || [];
        let activeCategory = ""; 
        let tempCheckoutData = null; 
        
        let currentSelectedSize = null; 
        let currentComboSize1 = null; 
        let currentComboSize2 = null; 
        
        const appDiv = document.getElementById('app');
        const topNav = document.getElementById('topNav');
        const bottomNav = document.getElementById('bottomNav');

        // --- REALTIME DATABASE SYNC ---
        async function initApp() {
            try {
                const prodSnapCheck = await db.ref('products').once('value');
                if (!prodSnapCheck.exists()) {
                    await seedInitialData();
                }

                const catSnap = await db.ref('categories').once('value');
                if(catSnap.exists()) {
                    categories = []; 
                    catSnap.forEach(child => {
                        if(child.val() && typeof child.val() === 'object') {
                            categories.push(child.val());
                        }
                    });
                }

                const pSnap = await db.ref('products').once('value');
                if(pSnap.exists()) {
                    products = [];
                    pSnap.forEach(child => {
                        if(child.val() && typeof child.val() === 'object') {
                            products.push(child.val());
                        }
                    });
                }

                const bSnap = await db.ref('banners').once('value');
                if(bSnap.exists()) {
                    banners = [];
                    bSnap.forEach(child => {
                        if(child.val() && typeof child.val() === 'object') {
                            banners.push(child.val());
                        }
                    });
                }

                const paySnap = await db.ref('settings/payment').once('value');
                if(paySnap.exists()) paymentSettings = paySnap.val();

                if(checkAuth()) {
                    goHome();
                    updateCartBadge();
                }
            } catch (error) {
                console.error("Database connection error: ", error);
                appDiv.innerHTML = `<div class="text-center mt-20 text-red-500 font-bold">Network Error. Please refresh.</div>`;
            }
        }

        async function seedInitialData() {
            await db.ref('settings/payment').set({
                qr_url: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=dummy@upi&pn=MZFASHION",
                upi_id: "dummy@upi",
                whatsapp: "919982437489"
            });
            await db.ref('banners').set({
                b1: { id: "b1", img: "256328.jpg", target_link: "#" },
                b2: { id: "b2", img: "https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=800&q=80", target_link: "#" }
            });
            await db.ref('categories').set({
                c1: { id: "c1", name: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=150&q=80" },
                c2: { id: "c2", name: "Jeans", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=150&q=80" },
                c3: { id: "c3", name: "Combos", img: "https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=150&q=80" }
            });
            await db.ref('products').set({
                p1: { id: "p1", name: "Premium Black T-Shirt", price: 499, mrp: 999, discount: "50% OFF", category: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80", shirtSizes: "S, M, L, XL, XXL", jeansSizes: "" },
                p2: { id: "p2", name: "Ripped Blue Jeans", price: 1099, mrp: 1999, discount: "45% OFF", category: "Jeans", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400&q=80", shirtSizes: "", jeansSizes: "28, 30, 32, 34, 36" },
                p3: { id: "p3", name: "Combo (Shirt + Jeans)", price: 1499, mrp: 3198, discount: "53% OFF", category: "Combos", img: "https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=400&q=80", shirtSizes: "S, M, L, XL, XXL", jeansSizes: "28, 30, 32, 34, 36" }
            });
        }

        // --- AUTHENTICATION ---
        function checkAuth() {
            if (!currentUser) {
                topNav.classList.add('hidden');
                bottomNav.classList.add('hidden');
                showLogin();
                return false;
            }
            topNav.classList.remove('hidden');
            bottomNav.classList.remove('hidden');
            return true;
        }

        function showLogin() {
            appDiv.innerHTML = `
                <div class="fade-in p-6 flex flex-col justify-center min-h-screen">
                    <div class="text-center mb-10">
                        <div class="w-24 h-24 mx-auto border-2 border-yellow-500 rounded-full overflow-hidden mb-4 shadow-[0_0_15px_rgba(212,175,55,0.5)]">
                            <img src="logo.png" onerror="this.src='https://ui-avatars.com/api/?name=MZ&background=000&color=D4AF37'" class="w-full h-full object-cover">
                        </div>
                        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 tracking-widest">MZ FASHION</h1>
                        <p class="text-gray-400 mt-2 text-sm">Welcome Back! Login to continue.</p>
                    </div>
                    
                    <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                        <div class="relative"><i class="fa-solid fa-phone absolute left-4 top-4 text-gray-500"></i><input type="tel" id="loginPhone" placeholder="Phone Number" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 pl-12 rounded-lg w-full"></div>
                        <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-4 text-gray-500"></i><input type="password" id="loginPassword" placeholder="Password" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 pl-12 rounded-lg w-full"></div>
                        <p id="loginError" class="text-red-500 text-xs text-center hidden">Invalid phone or password.</p>
                        <button type="submit" id="loginBtn" class="mt-4 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3.5 rounded-lg shadow-[0_0_15px_rgba(212,175,55,0.4)] w-full tracking-wide transition">LOGIN</button>
                    </form>
                    
                    <p class="text-center text-gray-400 mt-6 text-sm">Don't have an account? <span onclick="showRegister()" class="text-yellow-500 font-bold cursor-pointer">Register Now</span></p>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function showRegister() {
            appDiv.innerHTML = `
                <div class="fade-in p-6 flex flex-col justify-center min-h-screen">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 tracking-widest">REGISTER</h1>
                        <p class="text-gray-400 mt-2 text-sm">Create an account to start shopping.</p>
                    </div>
                    
                    <form onsubmit="handleRegister(event)" class="flex flex-col gap-4">
                        <div class="relative"><i class="fa-solid fa-user absolute left-4 top-4 text-gray-500"></i><input type="text" id="regName" placeholder="Full Name" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 pl-12 rounded-lg w-full"></div>
                        <div class="relative"><i class="fa-solid fa-phone absolute left-4 top-4 text-gray-500"></i><input type="tel" id="regPhone" placeholder="Phone Number" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 pl-12 rounded-lg w-full"></div>
                        <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-4 text-gray-500"></i><input type="password" id="regPassword" placeholder="Password" required class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-white p-3 pl-12 rounded-lg w-full"></div>
                        <p id="regError" class="text-red-500 text-xs text-center hidden">Phone number already registered.</p>
                        <button type="submit" id="regBtn" class="mt-4 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3.5 rounded-lg shadow-[0_0_15px_rgba(212,175,55,0.4)] w-full tracking-wide transition">CREATE ACCOUNT</button>
                    </form>
                    
                    <p class="text-center text-gray-400 mt-6 text-sm">Already have an account? <span onclick="showLogin()" class="text-yellow-500 font-bold cursor-pointer">Login Here</span></p>
                </div>
            `;
            window.scrollTo(0,0);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> LOGGING IN...`;

            try {
                const snapshot = await db.ref('users/' + phone).once('value');
                if (snapshot.exists() && snapshot.val().password === pass) {
                    currentUser = snapshot.val();
                    localStorage.setItem('mz_currentUser', JSON.stringify(currentUser));
                    updateCartBadge();
                    goHome();
                } else {
                    document.getElementById('loginError').classList.remove('hidden');
                    btn.innerHTML = "LOGIN";
                }
            } catch (error) {
                alert("Database Error!");
                btn.innerHTML = "LOGIN";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const pass = document.getElementById('regPassword').value;
            const btn = document.getElementById('regBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> CREATING ACCOUNT...`;
            
            try {
                const snapshot = await db.ref('users/' + phone).once('value');
                if (snapshot.exists()) {
                    document.getElementById('regError').classList.remove('hidden');
                    btn.innerHTML = "CREATE ACCOUNT";
                    return;
                }
                const newUser = { name, phone, password: pass, linkedEmail: "mzfashion@gmail.com" };
                await db.ref('users/' + phone).set(newUser);
                currentUser = newUser;
                localStorage.setItem('mz_currentUser', JSON.stringify(newUser));
                goHome();
            } catch (error) {
                alert("Database Error!");
                btn.innerHTML = "CREATE ACCOUNT";
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('mz_currentUser');
            checkAuth();
        }

        // --- VIEWS ---

        // 1. HOME PAGE
        function goHome() {
            if(!checkAuth()) return;
            
            let displayProducts = products;
            if(activeCategory !== "") {
                displayProducts = products.filter(p => p.category === activeCategory);
            }

            let catHTML = categories.map(cat => `
                <div onclick="filterCategory('${cat.name}')" class="flex flex-col items-center gap-1.5 cursor-pointer w-full">
                    <div class="w-12 h-12 md:w-14 md:h-14 rounded-full overflow-hidden border-[2.5px] ${activeCategory === cat.name ? 'border-yellow-400 shadow-[0_0_12px_rgba(212,175,55,0.8)]' : 'border-zinc-700'} transition-all mx-auto flex-shrink-0 bg-zinc-900">
                        <img src="${cat.img}" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[9px] md:text-[10px] ${activeCategory === cat.name ? 'text-yellow-400 font-extrabold' : 'text-gray-400 font-semibold'} text-center w-full uppercase break-words line-clamp-2 leading-tight">${cat.name}</span>
                </div>
            `).join('');
            
            let prodHTML = displayProducts.map(item => {
                const isLiked = likedItems.includes(item.id);
                return `
                <div class="bg-zinc-950 border border-yellow-600/30 rounded-lg shadow-lg relative flex flex-col justify-between overflow-hidden">
                    <button onclick="toggleLike(this, '${item.id}')" class="absolute top-2 right-2 ${isLiked ? 'text-red-500' : 'text-gray-500'} z-10 text-xl bg-black/60 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm shadow-md transition-colors">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <div onclick="viewProduct('${item.id}')" class="cursor-pointer relative">
                        <img src="${item.img}" class="w-full h-44 object-cover opacity-90 hover:opacity-100 transition duration-300">
                    </div>
                    <div class="p-3 flex flex-col flex-grow border-t border-yellow-600/20">
                        <h3 onclick="viewProduct('${item.id}')" class="text-sm font-semibold truncate text-gray-200 cursor-pointer">${item.name}</h3>
                        <div class="mt-1 flex items-center gap-2">
                            <span class="font-bold text-yellow-500">₹${item.price}</span>
                            <span class="text-xs line-through text-gray-500">₹${item.mrp}</span>
                        </div>
                        <span class="text-[10px] text-yellow-600 font-bold mt-1 bg-yellow-900/20 px-1 w-max rounded">${item.discount}</span>
                        
                        <div class="flex justify-between gap-1.5 mt-3">
                            <button onclick="viewProduct('${item.id}')" class="flex-1 bg-zinc-800 border border-yellow-500 text-yellow-500 font-bold py-1.5 rounded text-[10px] shadow-sm">CART</button>
                            <button onclick="viewProduct('${item.id}')" class="flex-1 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-1.5 rounded shadow-[0_0_10px_rgba(212,175,55,0.4)] text-[10px]">BUY NOW</button>
                        </div>
                    </div>
                </div>
            `}).join('');

            if(displayProducts.length === 0) {
                prodHTML = `<div class="col-span-2 text-center text-gray-500 py-10">No products found.</div>`;
            }

            let bannerHTML = banners.map(b => `
                <a href="${b.target_link || '#'}" class="min-w-full flex-shrink-0 snap-center relative h-60 block">
                    <img src="${b.img}" class="w-full h-full object-cover opacity-90">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                </a>
            `).join('');

            appDiv.innerHTML = `
                <div id="homeView" class="fade-in">
                    <!-- Banner Slider -->
                    <div id="bannerSlider" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar mx-4 mt-4 rounded-xl bg-zinc-950 border border-yellow-600/30 shadow-[0_0_10px_rgba(212,175,55,0.1)] relative" style="scroll-behavior: smooth;">
                        ${bannerHTML}
                    </div>

                    <!-- Categories 5 Column Grid -->
                    <div class="grid grid-cols-5 gap-y-4 gap-x-2 p-3 bg-zinc-950 border-b border-yellow-600/20 mt-4 justify-items-start items-start">
                        ${catHTML}
                    </div>
                    
                    <div class="p-4">
                        <h2 class="font-bold text-lg mb-4 text-yellow-500 tracking-wide border-l-4 border-yellow-500 pl-2 uppercase">${activeCategory !== "" ? activeCategory : "Latest"} Collection</h2>
                        <div class="grid grid-cols-2 gap-4">
                            ${prodHTML}
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);

            if(window.bannerScrollInterval) clearInterval(window.bannerScrollInterval);
            if(banners.length > 1) {
                setTimeout(() => {
                    window.bannerScrollInterval = setInterval(() => {
                        const slider = document.getElementById('bannerSlider');
                        if(!slider) {
                            clearInterval(window.bannerScrollInterval);
                            return;
                        }
                        const maxScrollLeft = slider.scrollWidth - slider.clientWidth;
                        if(slider.scrollLeft >= maxScrollLeft - 5) {
                            slider.scrollTo({ left: 0, behavior: 'smooth' });
                        } else {
                            slider.scrollBy({ left: slider.clientWidth, behavior: 'smooth' });
                        }
                    }, 3000); 
                }, 500);
            }
        }

        function filterCategory(catName) {
            if(activeCategory === catName) {
                activeCategory = "";
            } else {
                activeCategory = catName;
            }
            goHome();
        }

        // 2. LIKES PAGE
        function toggleLike(btn, id) {
            const index = likedItems.indexOf(id);
            if (index > -1) {
                likedItems.splice(index, 1);
                btn.classList.remove('text-red-500');
                btn.classList.add('text-gray-500');
            } else {
                likedItems.push(id);
                btn.classList.remove('text-gray-500');
                btn.classList.add('text-red-500');
            }
            localStorage.setItem('mz_likes', JSON.stringify(likedItems));
        }

        function showLikes() {
            if(!checkAuth()) return;
            let likedProducts = products.filter(p => likedItems.includes(p.id));
            let html = "";

            if (likedProducts.length === 0) {
                html = `
                    <div class="text-center p-10 mt-10">
                        <i class="fa-solid fa-heart-crack text-5xl text-gray-600 mb-4"></i>
                        <h2 class="text-gray-400 font-semibold">No Liked Items</h2>
                        <p class="text-xs text-gray-500 mt-2">Heart your favorite products to see them here.</p>
                    </div>
                `;
            } else {
                html = `<div class="grid grid-cols-2 gap-4">` + likedProducts.map(item => `
                    <div class="bg-zinc-950 border border-yellow-600/30 rounded-lg shadow-lg relative flex flex-col justify-between overflow-hidden">
                        <button onclick="toggleLike(this, '${item.id}'); setTimeout(showLikes, 300);" class="absolute top-2 right-2 text-red-500 z-10 text-xl bg-black/60 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm shadow-md transition-colors">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                        <div onclick="viewProduct('${item.id}')" class="cursor-pointer relative">
                            <img src="${item.img}" class="w-full h-44 object-cover opacity-90 hover:opacity-100 transition duration-300">
                        </div>
                        <div class="p-3 flex flex-col flex-grow border-t border-yellow-600/20">
                            <h3 class="text-sm font-semibold text-gray-200">${item.name}</h3>
                            <div class="mt-1 flex items-center gap-2">
                                <span class="font-bold text-yellow-500">₹${item.price}</span>
                            </div>
                            <div class="flex justify-between gap-1.5 mt-3">
                                <button onclick="viewProduct('${item.id}')" class="flex-1 bg-zinc-800 border border-yellow-500 text-yellow-500 font-bold py-1.5 rounded text-[10px] shadow-sm">CART</button>
                                <button onclick="viewProduct('${item.id}')" class="flex-1 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-1.5 rounded shadow-[0_0_10px_rgba(212,175,55,0.4)] text-[10px]">BUY NOW</button>
                            </div>
                        </div>
                    </div>
                `).join('') + `</div>`;
            }

            appDiv.innerHTML = `
                <div class="fade-in p-4 pb-10">
                    <h1 class="text-xl font-bold text-yellow-500 mb-6 border-b border-yellow-600/30 pb-2"><i class="fa-solid fa-heart mr-2"></i> My Likes</h1>
                    ${html}
                </div>
            `;
            window.scrollTo(0,0);
        }

        // 3. PROFILE PAGE
        function showProfile() {
            if(!checkAuth()) return;
            
            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-10">
                    <h1 class="text-xl font-bold text-yellow-500 mb-6 border-b border-yellow-600/30 pb-2">My Profile</h1>

            `;
            window.scrollTo(0,0);
        }

        function getValidatedSize(product) {
            let hasShirt = !!product.shirtSizes && product.shirtSizes.trim() !== "";
            let hasJeans = !!product.jeansSizes && product.jeansSizes.trim() !== "";
            
            if (hasShirt && hasJeans) {
                if(!currentComboSize1 || !currentComboSize2) return null;
                return `Top: ${currentComboSize1}, Bottom: ${currentComboSize2}`;
            } else if (hasShirt) {
                if(!currentComboSize1) return null;
                return currentComboSize1;
            } else if (hasJeans) {
                if(!currentComboSize2) return null;
                return currentComboSize2;
            } else {
                if(!currentSelectedSize) return null;
                return currentSelectedSize;
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const finalSize = getValidatedSize(product);
            
            if(!finalSize) {
                alert("Please select required sizes first!");
                return;
            }

            cart.push({ ...product, size: finalSize, cartId: Date.now() });
            localStorage.setItem('mz_cart', JSON.stringify(cart));
            updateCartBadge();
            
            const btn = document.getElementById(`addBtn-${id}`);
            if(btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> ADDED';
                btn.classList.add('bg-green-600', 'text-white', 'border-green-500');
                btn.classList.remove('bg-black', 'text-yellow-500', 'border-yellow-500');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600', 'text-white', 'border-green-500');
                    btn.classList.add('bg-black', 'text-yellow-500', 'border-yellow-500');
                }, 1500);
            }
        }

        function handleBuyNow(id) {
            const product = products.find(p => p.id === id);
            const finalSize = getValidatedSize(product);

            if(!finalSize) {
                alert("Please select required sizes first!");
                return;
            }
            currentSelectedSize = finalSize; 
            goToAddress(id);
        }

        function removeFromCart(index) { 
            cart.splice(index, 1); 
            localStorage.setItem('mz_cart', JSON.stringify(cart));
            updateCartBadge(); 
            showCart(); 
        }

        function updateCartBadge() {
            const badge = document.getElementById('bottomCartCount');
            if (cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); } 
            else { badge.classList.add('hidden'); }
        }

        // --- AUTOMATIC PINCODE FETCHING LOGIC ---
        async function fetchPinCodeDetails(pincode) {
            const statusEl = document.getElementById('pinStatus');
            const districtEl = document.getElementById('custDistrict');
            const stateEl = document.getElementById('custState');
            const villageEl = document.getElementById('custVillage');
            
            if (pincode.length === 6) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
                try {
                    let response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    let data = await response.json();
                    
                    if (data[0].Status === "Success") {
                        let postOffices = data[0].PostOffice;
                        districtEl.value = postOffices[0].District;
                        stateEl.value = postOffices[0].State;
                        
                        villageEl.innerHTML = '<option value="" disabled selected>Select Village / Area</option>';
                        postOffices.forEach(po => {
                            villageEl.innerHTML += `<option value="${po.Name}">${po.Name}</option>`;
                        });
                        villageEl.classList.remove('bg-zinc-900', 'text-gray-500');
                        villageEl.classList.add('bg-zinc-950', 'text-yellow-500');
                        districtEl.classList.remove('text-gray-500'); stateEl.classList.remove('text-gray-500');
                        districtEl.classList.add('text-gray-200'); stateEl.classList.add('text-gray-200');
                        statusEl.innerHTML = '<i class="fa-solid fa-check text-green-500"></i> Found';
                    } else {
                        statusEl.innerHTML = 'Invalid PIN';
                        districtEl.value = ""; stateEl.value = "";
                        villageEl.innerHTML = '<option value="" disabled selected>Enter valid PIN first</option>';
                        villageEl.classList.add('bg-zinc-900', 'text-gray-500'); villageEl.classList.remove('bg-zinc-950', 'text-yellow-500');
                    }
                } catch (e) {
                    statusEl.innerHTML = 'Error fetching data';
                }
            } else {
                statusEl.innerHTML = ''; districtEl.value = ""; stateEl.value = "";
                villageEl.innerHTML = '<option value="" disabled selected>Enter PIN to select Village</option>';
                villageEl.classList.add('bg-zinc-900', 'text-gray-500'); villageEl.classList.remove('bg-zinc-950', 'text-yellow-500');
            }
        }

        // --- SPLIT CHECKOUT ---
        function goToAddress(source) {
            let total = 0; let productNames = ""; let orderItems = []; let primaryImg = "";

            if (source === 'cart') {
                total = cart.reduce((sum, item) => sum + item.price, 0);
                productNames = cart.map(i => `${i.name} (Size: ${i.size})`).join(", ");
                primaryImg = cart[0].img;
                
                // MULTI-ITEM ARRAY CREATION
                orderItems = cart.map(i => ({ name: i.name, size: i.size, price: i.price, img: i.img }));
            } else {
                const product = products.find(p => p.id === source);
                total = product.price;
                productNames = `${product.name} (Size: ${currentSelectedSize})`;
                primaryImg = product.img;
                
                // SINGLE-ITEM ARRAY CREATION
                orderItems = [{ name: product.name, size: currentSelectedSize, price: product.price, img: product.img }];
            }

            tempCheckoutData = { names: productNames, price: total, img: primaryImg, items: orderItems };

            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-20">
                    <h1 class="text-xl font-bold text-yellow-500 mb-6 border-b border-yellow-600/30 pb-2">Delivery Details</h1>
                    <form onsubmit="goToPayment(event)" class="flex flex-col gap-4">
                        <div>
                            <input type="text" id="custName" value="${currentUser.name}" required placeholder="Full Name" class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-gray-200 p-3 rounded w-full mb-3 text-sm">
                            <input type="tel" id="custPhone" value="${currentUser.phone}" required placeholder="Phone Number" class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-gray-200 p-3 rounded w-full mb-3 text-sm">

                                <input type="number" id="custPincode" placeholder="6-Digit PIN Code" required pattern="[0-9]{6}" maxlength="6" onkeyup="fetchPinCodeDetails(this.value)" class="bg-zinc-950 border border-gray-700 focus:border-yellow-500 outline-none text-yellow-500 p-3 rounded w-full mb-3 text-sm font-bold tracking-widest">
                                <p id="pinStatus" class="text-[10px] text-yellow-500 absolute right-3 top-4"></p>
                            </div>
                            <div class="flex gap-2 mb-3">
                                <input type="text" id="custDistrict" placeholder="District" required readonly class="bg-zinc-900 border border-gray-700 text-gray-500 p-3 rounded w-1/2 text-sm focus:outline-none">
                                <input type="text" id="custState" placeholder="State" required readonly class="bg-zinc-900 border border-gray-700 text-gray-500 p-3 rounded w-1/2 text-sm focus:outline-none">
                            </div>
                            <select id="custVillage" required class="bg-zinc-900 border border-gray-700 text-gray-500 p-3 rounded w-full mb-3 text-sm focus:outline-none focus:border-yellow-500 transition-colors">
                                <option value="" disabled selected>Enter PIN to select Village / Area</option>
                            </select>

                        </div>
                        <button type="submit" class="mt-4 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-extrabold py-3.5 rounded shadow-[0_0_15px_rgba(212,175,55,0.4)] w-full tracking-wide">NEXT: PAYMENT</button>
                    </form>
                </div>

            tempCheckoutData.phone = document.getElementById('custPhone').value;

            appDiv.innerHTML = `

        async function confirmOrder(event) {
            event.preventDefault();
            const paymentType = document.getElementById('cod').checked ? "COD" : "Prepaid";
            const newOrder = {
                id: Date.now().toString(), date: new Date().toLocaleString(),
                name: tempCheckoutData.name, phone: tempCheckoutData.phone,
                address: tempCheckoutData.address, payment: paymentType,
                product_name: tempCheckoutData.names, price: tempCheckoutData.price,
                img: tempCheckoutData.img, 
                items: tempCheckoutData.items, // <-- ADDED ITEMS ARRAY FOR MULTIPLE PRODUCTS
                status: "Pending Verification" 
            };
            appDiv.innerHTML = `<div class="min-h-[70vh] flex flex-col items-center justify-center text-yellow-500"><i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i><p class="font-bold tracking-widest">PLACING ORDER...</p></div>`;
            window.scrollTo(0,0);
            try {
                await db.ref('orders/' + newOrder.id).set(newOrder);
                cart = []; localStorage.setItem('mz_cart', JSON.stringify(cart)); updateCartBadge();
                
                const waNum = paymentSettings.whatsapp;
                const waText = encodeURIComponent(`Hello MZ Fashion, here is my payment screenshot for Order ID: ${newOrder.id}`);

                appDiv.innerHTML = `
                    <div class="fade-in flex flex-col items-center justify-center min-h-[70vh] p-4 text-center">
                        <div class="w-20 h-20 bg-zinc-950 border-2 border-yellow-500 text-yellow-500 rounded-full flex items-center justify-center text-4xl mb-4 shadow-[0_0_20px_rgba(212,175,55,0.3)]"><i class="fa-solid fa-clock"></i></div>
                        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">Verification Pending!</h1>
                        <p class="text-gray-400 mt-2 text-sm">Thank you, <span class="text-gray-200 font-semibold">${tempCheckoutData.name}</span>.</p>
                        <p class="text-gray-400 mt-1 text-sm">Order ID: <b class="text-yellow-500 text-xs">${newOrder.id}</b></p>
                        
                        <div class="bg-red-900/20 border border-red-500/50 p-4 rounded-lg mt-5 mb-5 w-full max-w-sm">
                            <p class="text-sm text-red-400 font-bold mb-3">⚠️ Order will NOT be dispatched until payment screenshot is received.</p>
                            <a href="https://wa.me/${waNum}?text=${waText}" target="_blank" class="flex w-full items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(34,197,94,0.4)] animate-pulse transition">
                                <i class="fa-brands fa-whatsapp text-2xl"></i> SEND SCREENSHOT NOW
                            </a>
                        </div>

                        <button onclick="showMyOrders()" class="mt-2 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black px-8 py-3 rounded font-bold shadow-md transition-all w-full max-w-xs">View My Orders</button>
                        <button onclick="goHome()" class="mt-3 border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black px-8 py-3 rounded font-bold transition-all w-full max-w-xs">Continue Shopping</button>
                    </div>
                `;
            } catch (error) { alert("Database Error!"); goHome(); }
        }

        // --- MY ORDERS PAGE ---
        async function showMyOrders() {
            if(!checkAuth()) return;
            appDiv.innerHTML = `<div class="min-h-[70vh] flex flex-col items-center justify-center text-yellow-500"><i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i><p class="font-bold tracking-widest">LOADING ORDERS...</p></div>`;
            window.scrollTo(0,0);
            try {
                const snapshot = await db.ref('orders').orderByChild('phone').equalTo(currentUser.phone).once('value');
                let userOrders = []; snapshot.forEach(child => { userOrders.push(child.val()); });
                userOrders.sort((a, b) => b.id - a.id);
                let myOrdersHTML = "";
                if (userOrders.length > 0) {
                    userOrders.forEach(order => {
                        let paymentStatus = ""; let tokenAmount = 0; let remainingAmount = 0;
                        if(order.payment === "COD") {
                            tokenAmount = Math.round(order.price * 0.30); remainingAmount = order.price - tokenAmount;
                            paymentStatus = `<p class="text-xs text-gray-400 mt-1">Total: ₹${order.price}</p><p class="text-xs text-green-500 font-semibold">Paid Token: ₹${tokenAmount}</p><p class="text-xs text-red-400 font-semibold">To Pay on Delivery: ₹${remainingAmount}</p>`;
                        } else {
                            paymentStatus = `<p class="text-xs text-gray-400 mt-1">Total: ₹${order.price}</p><p class="text-xs text-green-500 font-semibold">Paid: ₹${order.price} (Full Payment)</p>`;
                        }
                        
                        let statusBadge = "";
                        let currentStatus = order.status || "Pending Verification";
                        if(currentStatus === "Confirmed") {
                            statusBadge = `<span class="inline-block px-2 py-0.5 bg-green-900/30 text-green-500 text-[10px] rounded border border-green-600/50 uppercase font-bold"><i class="fa-solid fa-check"></i> Confirmed</span>`;
                        } else if(currentStatus === "Rejected") {
                            statusBadge = `<span class="inline-block px-2 py-0.5 bg-red-900/30 text-red-500 text-[10px] rounded border border-red-600/50 uppercase font-bold"><i class="fa-solid fa-xmark"></i> Rejected</span>`;
                        } else {
                            statusBadge = `<span class="inline-block px-2 py-0.5 bg-yellow-900/30 text-yellow-500 text-[10px] rounded border border-yellow-600/50 uppercase font-bold"><i class="fa-solid fa-clock"></i> ${currentStatus}</span>`;
                        }

                        // MULTIPLE ITEMS RENDERING LOGIC
                        let itemsHTML = "";
                        if (order.items && order.items.length > 0) {
                            itemsHTML = `<div class="mt-2 flex flex-col gap-2">` + order.items.map(item => `
                                <div class="flex items-center gap-3 bg-zinc-900 p-2 rounded border border-gray-800">
                                    <img src="${item.img}" class="w-12 h-12 object-cover rounded border border-gray-700">
                                    <div class="flex-grow overflow-hidden">
                                        <p class="font-bold text-gray-200 text-[11px] break-words">${item.name}</p>
                                        <p class="text-[10px] text-yellow-500 mt-0.5">Size: ${item.size} | ₹${item.price}</p>
                                    </div>
                                </div>
                            `).join('') + `</div>`;
                        } else {
                            // Fallback for older single items
                            itemsHTML = `
                                <div class="flex items-center gap-3 bg-zinc-900 p-2 rounded border border-gray-800 mt-2">
                                    <img src="${order.img}" class="w-12 h-12 object-cover rounded border border-gray-700">
                                    <div class="flex-grow overflow-hidden">
                                        <p class="font-bold text-gray-200 text-[11px] break-words">${order.product_name}</p>
                                    </div>
                                </div>
                            `;
                        }

                        myOrdersHTML += `
                            <div class="bg-zinc-950 border border-yellow-600/30 rounded-lg p-4 shadow-md mb-4">
                                <div class="border-b border-gray-800 pb-3 mb-3">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <p class="text-[10px] text-gray-400">Order ID: ${order.id}</p>
                                            <p class="text-[9px] text-gray-500">${order.date}</p>
                                        </div>
                                        <div class="text-right flex flex-col items-end">
                                            ${statusBadge}
                                            <span class="inline-block mt-1.5 px-2 py-0.5 bg-gray-900/30 text-gray-400 text-[9px] rounded border border-gray-600/50 uppercase w-max">${order.payment}</span>
                                        </div>
                                    </div>
                                    ${itemsHTML}
                                </div>
                                <div class="mb-3"><p class="text-sm text-gray-300 font-semibold"><i class="fa-solid fa-location-dot text-yellow-500 mr-1 w-4"></i> Deliver To:</p><p class="text-xs text-gray-400 ml-5">${order.name}</p><p class="text-xs text-gray-400 ml-5">${order.address}</p></div>
                                <div class="bg-zinc-900 p-3 rounded border border-gray-800"><p class="text-sm text-gray-300 font-semibold mb-1"><i class="fa-solid fa-wallet text-yellow-500 mr-1 w-4"></i> Payment Info:</p>${paymentStatus}</div>
                            </div>
                        `;
                    });
                } else {
                    myOrdersHTML = `<div class="text-center p-10 bg-zinc-950 rounded-lg border border-gray-800 mt-4"><i class="fa-solid fa-box-open text-5xl text-gray-600 mb-4"></i><h2 class="text-gray-400 font-semibold">No Orders Found</h2><button onclick="goHome()" class="mt-4 border border-yellow-500 text-yellow-500 px-6 py-2 rounded text-sm font-bold">Start Shopping</button></div>`;
                }
                appDiv.innerHTML = `<div class="fade-in p-4 pb-20"><h1 class="text-xl font-bold text-yellow-500 mb-6 border-b border-yellow-600/30 pb-2"><i class="fa-solid fa-box mr-2"></i> My Orders</h1>${myOrdersHTML}</div>`;
            } catch (error) { appDiv.innerHTML = `<div class="p-10 text-center text-red-500">Error connecting to database.</div>`; }
        }

        // Init App 
        initApp();
    </script>
</body>
</html>
