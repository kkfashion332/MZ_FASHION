<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MZ Fashion - Premium Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;600&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
  /* =========================================
     ALL CSS INCLUDED HERE
     ========================================= */
  :root{
    --gold:#d4a94a; --gold-soft:#f0d488; --gold-deep:#8a6a1f;
    --bg:#0a0a0a; --bg2:#141210; --fg:#f5efe0; --muted:#8a8578;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden; scroll-behavior: smooth;}

  /* INTRO ANIMATION */
  #intro-container {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    transition: opacity 1s ease;
  }
  .bg-radial{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#1c1610 0%,#050505 70%);}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 30%,rgba(0,0,0,.9) 80%);}
  .hero{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
  .logo-wrap{position:relative;}
  .ring{position:absolute;inset:0;border:1px solid rgba(212,169,74,.45);border-radius:18px;animation:pulseRing 3.5s cubic-bezier(.2,.8,.3,1) infinite;}
  .ring:nth-child(2){animation-delay:1.1s;}
  .ring:nth-child(3){animation-delay:2.2s;}
  .brush{position:absolute;inset:-40px;z-index:-1;border-radius:24px;filter:blur(34px);
    background:conic-gradient(from 220deg,transparent 0%,rgba(212,169,74,.55) 20%,transparent 45%,rgba(240,212,136,.5) 65%,transparent 90%);
    opacity:0;transform:rotate(-40deg);animation:arcIn 1.6s cubic-bezier(.2,.8,.2,1) forwards,spinSlow 22s linear infinite 1.6s;}
  .logo-inner{position:relative;width:240px;height:240px;border-radius:18px;
    box-shadow:0 0 60px rgba(212,169,74,.35),0 0 140px rgba(212,169,74,.18),0 30px 80px rgba(0,0,0,.7);
    animation:floatSlow 7s ease-in-out infinite 2.4s;}
  @media(min-width:768px){.logo-inner{width:310px;height:310px;}}
  .tiles{position:absolute;inset:0;border-radius:18px;overflow:hidden;border:1px solid rgba(212,169,74,.25);}
  .tile{position:absolute;width:25%;height:25%;background-size:400% 400%;background-repeat:no-repeat;
    opacity:0;transform:translate3d(var(--tx),var(--ty),0) rotate(var(--tr)) scale(.4);
    filter:blur(6px);
    animation:shardIn .9s cubic-bezier(.2,.8,.25,1) forwards;}
  .shine-wrap{position:absolute;inset:0;overflow:hidden;border-radius:18px;pointer-events:none;}
  .shine{position:absolute;top:-20px;bottom:-20px;width:36%;
    background:linear-gradient(90deg,transparent,rgba(240,212,136,.55),transparent);
    transform:translateX(-100%) skewX(-20deg);opacity:0;
    animation:shineIn .01s linear forwards 2.2s,goldSweep 4.5s ease-in-out infinite 2.4s;}
  .tag{margin-top:56px;margin-bottom:18px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.6em;color:rgba(240,212,136,.85);text-transform:uppercase;opacity:0;transform:translateY(20px);animation:fadeUp .9s ease forwards 2.6s;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(44px,9vw,104px);line-height:.95;letter-spacing:-.02em;max-width:960px;}
  h1 .w{display:inline-block;margin-right:14px;opacity:0;transform:translateY(40px);filter:blur(10px);}
  h1 .w1{animation:blurUp 1s cubic-bezier(.2,.8,.2,1) forwards 2.7s;}
  h1 .w2{animation:blurUp 1s cubic-bezier(.2,.8,.2,1) forwards 2.85s;}
  h1 .w3{animation:blurUp 1s cubic-bezier(.2,.8,.2,1) forwards 3s;}
  h1 .w4{animation:blurUp 1s cubic-bezier(.2,.8,.2,1) forwards 3.15s;}
  .gold{background:linear-gradient(90deg,#8a6a1f 0%,#f5e3a8 25%,#c99a3d 50%,#f5e3a8 75%,#8a6a1f 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite;}
  .particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .particles span{position:absolute;font-family:'Cinzel',serif;color:rgba(240,212,136,.35);user-select:none;animation:drift linear infinite;}

  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
  @keyframes blurUp{to{opacity:1;transform:translateY(0);filter:blur(0);}}
  @keyframes arcIn{to{opacity:1;transform:rotate(0);}}
  @keyframes spinSlow{to{transform:rotate(360deg);}}
  @keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-18px) rotate(2deg);}}
  @keyframes pulseRing{0%{transform:scale(.92);opacity:.6;}100%{transform:scale(1.35);opacity:0;}}
  @keyframes goldSweep{0%{transform:translateX(-120%) skewX(-20deg);}60%,100%{transform:translateX(340%) skewX(-20deg);}}
  @keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
  @keyframes drift{0%{transform:translate(0,0);opacity:0;}10%{opacity:1;}100%{transform:translate(var(--dx),var(--dy));opacity:0;}}
  @keyframes shardIn{60%{filter:blur(0);}100%{opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1);filter:blur(0);}}
  @keyframes shineIn{to{opacity:1;}}

  /* MAIN WEBSITE STYLES */
  #main-website {
    display: none; 
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  
  header {
    display: flex;
    justify-content: flex-end; 
    align-items: center;
    padding: 15px 20px;
    background: rgba(10, 10, 10, 0.9);
    border-bottom: 1px solid rgba(212,169,74,.2);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  
  .logo-square {
    width: 55px;
    height: 55px;
    border-radius: 8px; 
    background-image: url('logo.png'); 
    background-color: #222;
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 15px rgba(212,169,74,0.5);
    border: 2px solid var(--gold-deep);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .logo-square:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(212,169,74,0.8);
  }

  .banners-container {
    padding: 20px;
    display: flex;
    gap: 15px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .banners-container::-webkit-scrollbar { display: none; }
  .banner {
    min-width: 100%; 
    height: 200px;   
    background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(212,169,74,.3);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  
  /* Missing Data Styles */
  .no-data {
    width: 100%;
    text-align: center;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    padding: 20px 0;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    text-align: center;
    font-size: 28px;
    margin: 30px 0 20px;
    color: var(--gold);
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); 
    gap: 15px;
    padding: 0 15px 60px;
  }
  .product-card {
    background: var(--bg2);
    border: 1px solid rgba(212,169,74,.15);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    transition: transform 0.3s, border-color 0.3s;
  }
  .product-card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
  }
  .product-img {
    width: 100%;
    height: 180px;
    background-color: #111;
    background-size: cover;
    background-position: center;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .product-card h3 {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--fg);
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-card p {
    color: var(--gold-soft);
    font-size: 16px;
    font-weight: 600;
  }

  /* Admin Modal */
  #admin-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
  }
  .admin-panel {
    background: #111;
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 30px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 0 50px rgba(212,169,74,0.2);
    max-height: 90vh;
    overflow-y: auto;
  }
  .admin-panel h2 {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    text-align: center;
    margin-bottom: 25px;
    font-size: 24px;
  }
  .admin-actions {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .admin-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.3s;
  }
  .admin-btn:hover {
    background: var(--gold);
    color: #000;
  }
  .close-admin {
    margin-top: 25px;
    border-color: #ff4444;
    color: #ff4444;
  }
  .close-admin:hover {
    background: #ff4444;
    color: #fff;
  }
</style>
</head>
<body>

<!-- INTRO ANIMATION SCREEN -->
<div id="intro-container">
  <div class="bg-radial"></div>
  <div class="vignette"></div>
  <div class="particles" id="particles"></div>

  <section class="hero">
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="brush"></div>
      <div class="logo-inner">
        <div class="tiles" id="tiles"></div>
        <div class="shine-wrap"><div class="shine"></div></div>
      </div>
    </div>
    <div class="tag">Welcome to your trusted shop</div>
    <h1>
      <span class="w w1">Your</span>
      <span class="w w2 gold">Style,</span>
      <span class="w w3">My</span>
      <span class="w w4 gold">Shop.</span>
    </h1>
  </section>
</div>

<!-- MAIN WEBSITE CONTENT -->
<div id="main-website">
  <header>
    <!-- Upper right square logo (7 Taps for Admin) -->
    <div class="logo-square" onclick="window.handleLogoTap()"></div>
  </header>

  <main>
    <!-- Banners Section (Realtime Data) -->
    <div class="banners-container" id="banner-container">
      <div class="no-data">Loading Banners...</div>
    </div>

    <!-- Products Section (Realtime Data) -->
    <h2 class="section-title">New Arrivals</h2>
    <div class="products-grid" id="product-grid">
      <!-- Loading message -->
      <div class="no-data" style="grid-column: span 2;">Loading Products...</div>
    </div>
  </main>
</div>

<!-- ADMIN PLANNER MODAL -->
<div id="admin-modal">
  <div class="admin-panel">
    <h2>Admin Planner</h2>
    <div class="admin-actions">
      <button class="admin-btn" onclick="window.addBannerURL()">+ Add Banner (Image URL)</button>
      <button class="admin-btn" onclick="window.removeBanner()">- Remove Last Banner</button>
      <button class="admin-btn" onclick="window.addProductData()">+ Add Product (URL, Name, Price)</button>
      <button class="admin-btn" onclick="window.editProductData()">✎ Edit Product</button>
      <button class="admin-btn" onclick="window.removeProduct()">- Remove Last Product</button>
    </div>
    <button class="admin-btn close-admin" onclick="window.closeAdmin()">Close Admin Planner</button>
  </div>
</div>

<!-- TYPE="MODULE" IS IMPORTANT FOR FIREBASE -->
<script type="module">
  // 1. Firebase SDKs Import 
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // 2. User's Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD5qRE8B6uwDUVWdUjnKYfGHOCOOhnK1Rk",
    authDomain: "mz-fashion-f4c8d.firebaseapp.com",
    projectId: "mz-fashion-f4c8d",
    storageBucket: "mz-fashion-f4c8d.firebasestorage.app",
    messagingSenderId: "756363172587",
    appId: "1:756363172587:web:b61d87481984267f9f7cae",
    databaseURL: "https://mz-fashion-f4c8d-default-rtdb.firebaseio.com" // Important for Realtime DB
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  /* =========================================
     ANIMATION LOGIC
     ========================================= */
  const LOGO_URL = "logo.png"; // Yahan se tiles me photo jayegi

  // Shards
  const tiles = document.getElementById('tiles');
  if(tiles) {
    for (let i = 0; i < 16; i++) {
      const row = Math.floor(i / 4), col = i % 4;
      const seed = (i * 9301 + 49297) % 233280;
      const rnd = seed / 233280;
      const angle = rnd * Math.PI * 2;
      const dist = 260 + ((i * 37) % 180);
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const tr = ((i * 47) % 720) - 360;
      const delay = 0.15 + (row + col) * 0.08 + (i % 3) * 0.03;
      const el = document.createElement('div');
      el.className = 'tile';
      el.style.cssText = `
        left:${col*25}%; top:${row*25}%;
        background-image:url('${LOGO_URL}');
        background-position:${(col/3)*100}% ${(row/3)*100}%;
        --tx:${tx}px; --ty:${ty}px; --tr:${tr}deg;
        animation-delay:${delay}s;
      `;
      tiles.appendChild(el);
    }
  }

  // Particles
  const p = document.getElementById('particles');
  if(p) {
    const chars = ['M','Z','✦','♛','MZ','F'];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.textContent = chars[i % chars.length];
      s.style.cssText = `
        left:${(i*37)%100}%; top:${(i*53)%100}%;
        font-size:${14 + ((i*7)%24)}px;
        animation-duration:${12 + ((i*3)%14)}s;
        animation-delay:${(i%7)*0.8}s;
        --dx:${((i*91)%200)-100}px;
        --dy:${-150 - ((i*43)%200)}px;
      `;
      p.appendChild(s);
    }
  }

  // 6 Seconds Page Transition
  setTimeout(() => {
    const intro = document.getElementById('intro-container');
    const main = document.getElementById('main-website');
    if(intro && main) {
      intro.style.display = 'none';
      main.style.display = 'block';
      setTimeout(() => { main.style.opacity = '1'; }, 50);
    }
  }, 6000); 

  /* =========================================
     REAL-TIME DATABASE LOGIC (FETCH DATA)
     ========================================= */
  
  let currentBanners = [];
  let currentProducts = [];

  // 1. Fetch Banners
  const bannersRef = ref(db, 'banners');
  onValue(bannersRef, (snapshot) => {
    const container = document.getElementById('banner-container');
    container.innerHTML = '';
    currentBanners = [];

    if(snapshot.exists()) {
      snapshot.forEach((child) => {
        currentBanners.push({ key: child.key, data: child.val() });
        const newBanner = document.createElement('div');
        newBanner.className = 'banner';
        newBanner.style.backgroundImage = `url('${child.val().url}')`;
        container.appendChild(newBanner);
      });
    } else {
      container.innerHTML = '<div class="no-data">No Banners Added Yet.</div>';
    }
  });

  // 2. Fetch Products
  const productsRef = ref(db, 'products');
  onValue(productsRef, (snapshot) => {
    const container = document.getElementById('product-grid');
    container.innerHTML = '';
    currentProducts = [];

    if(snapshot.exists()) {
      snapshot.forEach((child) => {
        currentProducts.push({ key: child.key, data: child.val() });
        const newProduct = document.createElement('div');
        newProduct.className = 'product-card';
        newProduct.innerHTML = `
          <div class="product-img" style="background-image: url('${child.val().url}')"></div>
          <h3 class="p-name">${child.val().name}</h3>
          <p class="p-price">${child.val().price}</p>
        `;
        container.appendChild(newProduct);
      });
    } else {
      container.innerHTML = '<div class="no-data" style="grid-column: span 2;">No Products Added Yet.</div>';
    }
  });


  /* =========================================
     ADMIN PANEL & CRUD LOGIC
     ========================================= */
  let tapCount = 0;
  let tapTimeout;

  window.handleLogoTap = function() {
    tapCount++;
    clearTimeout(tapTimeout);
    tapTimeout = setTimeout(() => { tapCount = 0; }, 2000);

    if (tapCount === 7) {
      setTimeout(() => {
        let pin = prompt("Enter Admin PIN (Hint: 4321):");
        if (pin === "4321") {
          document.getElementById('admin-modal').style.display = 'flex';
        } else {
          alert("Access Denied: Incorrect PIN.");
        }
      }, 100);
      tapCount = 0; 
    }
  };

  window.closeAdmin = function() {
    document.getElementById('admin-modal').style.display = 'none';
  };

  // BANNER ADMIN ACTIONS
  window.addBannerURL = function() {
    let imgUrl = prompt("Enter Banner Image URL:");
    if (!imgUrl) return;

    push(ref(db, 'banners'), { url: imgUrl })
      .then(() => alert('Banner saved to Firebase!'))
      .catch((error) => alert('Error saving banner: ' + error.message));
  };

  window.removeBanner = function() {
    if (currentBanners.length === 0) {
      alert('No banners to remove.');
      return;
    }
    // Remove the last banner in the array
    const lastBannerKey = currentBanners[currentBanners.length - 1].key;
    remove(ref(db, 'banners/' + lastBannerKey))
      .then(() => alert('Banner deleted from Firebase!'))
      .catch((error) => alert('Error: ' + error.message));
  };

  // PRODUCT ADMIN ACTIONS
  window.addProductData = function() {
    let imgUrl = prompt("1. Enter Product Image URL:");
    if (!imgUrl) return;
    let name = prompt("2. Enter Product Name:");
    if (!name) name = "MZ Item";
    let price = prompt("3. Enter Product Price (e.g., ₹2,999):");
    if (!price) price = "₹0";

    push(ref(db, 'products'), { url: imgUrl, name: name, price: price })
      .then(() => alert('Product saved to Firebase!'))
      .catch((error) => alert('Error saving product: ' + error.message));
  };

  window.editProductData = function() {
    if (currentProducts.length === 0) {
      alert("No products exist to edit.");
      return;
    }
    let index = prompt(`Enter product number to edit (1 to ${currentProducts.length}):`);
    let idx = parseInt(index) - 1;

    if (idx >= 0 && idx < currentProducts.length) {
      let product = currentProducts[idx];
      let newUrl = prompt("Enter New Image URL (leave blank to skip):", product.data.url);
      let newName = prompt("Enter New Name (leave blank to skip):", product.data.name);
      let newPrice = prompt("Enter New Price (leave blank to skip):", product.data.price);

      update(ref(db, 'products/' + product.key), {
        url: newUrl || product.data.url,
        name: newName || product.data.name,
        price: newPrice || product.data.price
      })
      .then(() => alert('Product updated in Firebase!'))
      .catch((error) => alert('Error updating: ' + error.message));

    } else {
      alert("Invalid product number.");
    }
  };

  window.removeProduct = function() {
    if (currentProducts.length === 0) {
      alert('No products to remove.');
      return;
    }
    // Remove the last product in the array
    const lastProductKey = currentProducts[currentProducts.length - 1].key;
    remove(ref(db, 'products/' + lastProductKey))
      .then(() => alert('Product deleted from Firebase!'))
      .catch((error) => alert('Error: ' + error.message));
  };

</script>
</body>
</html>
